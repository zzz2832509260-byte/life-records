/* ==========================================================================
   「今天要处理」—— 借鉴 每日工作台的 todayDigest()
   原来「今天」页只回答"我记了什么"，回答不了"我要做什么"。
   这三个数字才是打开应用时第一个该看到的东西：
     逾期几件 / 今天几件 / 钉选的三件是什么
   ========================================================================== */
var PRIOS = ['P0','P1','P2'];
var PRIO_BADGE = { 'P0':'b-red', 'P1':'b-amber', 'P2':'b-gray' };
var PRIO_RANK = { 'P0':0, 'P1':1, 'P2':2 };

/* 逾期 = 计划日期已经过了、但还没完成 */
function isOverdue(t){
  return t.status !== '完成' && !!t.date && t.date < todayStr();
}
function isDueToday(t){
  return t.status !== '完成' && t.date === todayStr();
}
function openTasks(){ return alive(DB.tasks).filter(function(t){ return t.status !== '完成'; }); }
function pinnedTasks(){
  return alive(DB.tasks).filter(function(t){ return t.pin && t.status !== '完成'; });
}
function overdueDays(t){ return daysBetween(t.date, todayStr()); }

/* 排序：逾期最久的最前 → 优先级 → 计划日期 */
function byUrgency(a, b){
  /* 逾期的永远在最前，且拖得越久越靠前（用 -1 表示"没逾期"） */
  var da = isOverdue(a) ? overdueDays(a) : -1;
  var db2 = isOverdue(b) ? overdueDays(b) : -1;
  if(da !== db2) return db2 - da;
  var pa = PRIO_RANK[a.prio] != null ? PRIO_RANK[a.prio] : 9;
  var pb = PRIO_RANK[b.prio] != null ? PRIO_RANK[b.prio] : 9;
  if(pa !== pb) return pa - pb;
  return (a.date || '') < (b.date || '') ? -1 : ((a.date || '') > (b.date || '') ? 1 : 0);
}

function todayDigest(){
  var open = openTasks();
  var over = open.filter(isOverdue).sort(byUrgency);
  var due  = open.filter(isDueToday).sort(byUrgency);
  var pinned = pinnedTasks().sort(byUrgency);
  /* 钉选里可能同时是逾期或今天的，去重后再算"今天要处理"总数 */
  var seen = {};
  var all = over.concat(due, pinned).filter(function(t){
    if(seen[t.id]) return false;
    seen[t.id] = 1;
    return true;
  });
  return { over: over, due: due, pinned: pinned, open: open.length, all: all };
}

/* 没手动钉选时，自动推荐三件：逾期优先 → P0 → P1 → 今天 */
function suggestTop3(){
  var d = todayDigest();
  return d.all.slice(0, 3);
}
/* 第几条是"今日三件"里的（没有手动钉选就用推荐的前三条） */
function top3Ids(){
  var pin = pinnedTasks();
  var list = pin.length ? pin.slice(0, 3) : suggestTop3();
  return list.map(function(t){ return t.id; });
}
function habitRate(habitId, dates){
  var total = 0, ok = 0;
  dates.forEach(function(d){
    var row = DB.habits.log[d];
    if(row && (row[habitId]===true || row[habitId]===false)){ total++; if(row[habitId]) ok++; }
  });
  return total ? ok/total : null;
}
function habitStreak(habitId){
  var d = todayStr(), n = 0, guard = 0;
  /* 今天没打卡不算断（还没到晚上），从昨天开始数 */
  var row = DB.habits.log[d];
  if(!(row && row[habitId])) d = addDays(d,-1);
  while(guard++ < 400){
    var r = DB.habits.log[d];
    if(r && r[habitId]){ n++; d = addDays(d,-1); } else break;
  }
  return n;
}
function dailyStreak(){
  var d = todayStr(), n = 0, guard = 0;
  if(!hasDaily(d)) d = addDays(d,-1);
  while(guard++ < 1200){
    if(hasDaily(d)){ n++; d = addDays(d,-1); } else break;
  }
  return n;
}
function weekSummary(wk){
  var dates = weekDates(wk);
  var tasks = tasksIn(dates);
  var done = tasks.filter(function(t){ return t.status==='完成'; });
  var blocked = tasks.filter(function(t){ return t.status==='阻塞'; });
  var fire = tasks.filter(function(t){ return t.type==='救火'; });
  var mins = tasks.reduce(function(a,t){ return a + (num(t.minutes)||0); }, 0);
  var notes = notesIn(dates);
  var refs = reflectsIn(dates);
  var recorded = dates.filter(hasDaily).length;
  return {
    dates: dates,
    recorded: recorded,
    mood: avg(dates.map(function(d){ var x=dpeek(d); return x?num(x.mood):null; })),
    energy: avg(dates.map(function(d){ var x=dpeek(d); return x?num(x.energy):null; })),
    sleep: avg(dates.map(function(d){ var x=dpeek(d); return x?num(x.sleep):null; })),
    taskTotal: tasks.length,
    taskDone: done.length,
    taskBlocked: blocked.length,
    fireRate: tasks.length ? fire.length/tasks.length : null,
    fireCount: fire.length,
    minutes: mins,
    noteNew: notes.length,
    noteDone: notes.filter(function(n){ return n.status==='已用掉' || n.status==='已归档'; }).length,
    reflectN: refs.length,
    reflectDays: dates.filter(function(d){ return refs.some(function(r){ return r.date===d; }); }).length,
    habitRates: DB.habits.config.map(function(h){
      return { name:h.name, id:h.id, rate: habitRate(h.id, dates) };
    })
  };
}

/* ==========================================================================
   合并引擎
   两台设备各改各的，同步时要合成一份。规则：
     · 同一条记录，谁的时间戳更新谁赢（Last-Write-Wins）
     · 删除用"墓碑"表达，否则另一台设备会把删掉的东西又推回来
     · 结果必须与"先传哪一边"无关（可交换），不然两台设备会各自收敛到不同结果
   ========================================================================== */
function touch(rec){
  if(rec && typeof rec==='object') rec.updatedAt = Date.now();
  return rec;
}
function tombstone(kind, id){
  if(!DB.tomb) DB.tomb = {};
  DB.tomb[kind+':'+id] = Date.now();
}

function hashStr(s){
  var h = 5381, i = s.length;
  while(i) h = (h*33) ^ s.charCodeAt(--i);
  return (h>>>0).toString(36) + '-' + s.length;
}
/* 规范化：对象键排序、数组元素排序。这样"内容相同但顺序不同"不会算出两个哈希，
   否则每次同步都会误判成"有变化"，白白多推一轮。 */
function canonValue(v){
  if(Array.isArray(v)){
    var arr = v.map(canonValue);
    if(arr.length && arr.every(function(x){ return x && typeof x==='object' && x.id!=null; })){
      arr.sort(function(a,b){ return a.id<b.id ? -1 : (a.id>b.id ? 1 : 0); });
    }else if(arr.every(function(x){ return x==null || typeof x!=='object'; })){
      arr = arr.slice().sort();
    }
    return arr;
  }
  if(v && typeof v==='object'){
    var o = {};
    Object.keys(v).sort().forEach(function(k){ o[k] = canonValue(v[k]); });
    return o;
  }
  return v;
}
function hashDB(db){ return hashStr(JSON.stringify(canonValue(db))); }

/* 谁更新？时间戳相同时用 JSON 字符串做确定性裁决，保证两台设备结论一致 */
function pickNewer(x, y){
  if(x===undefined || x===null) return y;
  if(y===undefined || y===null) return x;
  var tx = numOr(x.updatedAt, 0), ty = numOr(y.updatedAt, 0);
  if(tx !== ty) return tx > ty ? x : y;
  return (JSON.stringify(x) >= JSON.stringify(y)) ? x : y;
}

function mergeRecordMap(a, b, kind, tomb){
  var keys = {};
  Object.keys(a||{}).forEach(function(k){ keys[k]=1; });
  Object.keys(b||{}).forEach(function(k){ keys[k]=1; });
  var out = {};
  Object.keys(keys).sort().forEach(function(k){
    var rec = pickNewer((a||{})[k], (b||{})[k]);
    if(rec==null) return;
    var t = tomb[kind+':'+k];
    if(t!=null && t >= numOr(rec.updatedAt, 0)) return;   /* 删除发生得更晚 → 真删掉 */
    out[k] = rec;
  });
  return out;
}

function mergeArrays(a, b, kind, tomb, cmp){
  var map = {};
  function add(list){
    (list||[]).forEach(function(r){
      if(!r || r.id==null) return;
      map[r.id] = (map[r.id]===undefined) ? r : pickNewer(map[r.id], r);
    });
  }
  add(a); add(b);
  var out = [];
  Object.keys(map).forEach(function(id){
    var r = map[id];
    var t = tomb[kind+':'+id];
    if(t!=null && t >= numOr(r.updatedAt, 0)) return;
    out.push(r);
  });
  out.sort(cmp || function(x,y){ return x.id<y.id ? -1 : (x.id>y.id ? 1 : 0); });
  return out;
}

function mergeTomb(a, b){
  var out = {};
  Object.keys(a||{}).sort().forEach(function(k){ out[k] = a[k]; });
  Object.keys(b||{}).sort().forEach(function(k){
    out[k] = (out[k]==null || b[k] > out[k]) ? b[k] : out[k];
  });
  return out;
}

/* 打卡逐格合并：同一天两台设备各打一个勾，两个勾都要保住。
   如果按"整天"比时间戳，后同步的那台会把另一台的勾整个覆盖掉。 */
function mergeHabitLog(aLog, aTs, bLog, bTs, tomb){
  var dates = {};
  Object.keys(aLog||{}).forEach(function(d){ dates[d]=1; });
  Object.keys(bLog||{}).forEach(function(d){ dates[d]=1; });
  var outLog = {}, outTs = {};
  Object.keys(dates).sort().forEach(function(d){
    var la=(aLog||{})[d]||{}, lb=(bLog||{})[d]||{};
    var ta=(aTs||{})[d]||{},  tb=(bTs||{})[d]||{};
    var ids = {};
    Object.keys(la).forEach(function(i){ ids[i]=1; });
    Object.keys(lb).forEach(function(i){ ids[i]=1; });
    var row={}, rowT={};
    Object.keys(ids).sort().forEach(function(hid){
      if(tomb['habit:'+hid]!=null) return;          /* 这个习惯已被删除 */
      var hasA = la[hid]!==undefined, hasB = lb[hid]!==undefined;
      var va, vt;
      if(hasA && hasB){
        var x = numOr(ta[hid],0), y = numOr(tb[hid],0);
        if(x !== y){ va = x>y ? la[hid] : lb[hid]; vt = x>y ? x : y; }
        else { va = (la[hid]===lb[hid]) ? la[hid] : (la[hid] || lb[hid]); vt = x; }
      }else if(hasA){ va = la[hid]; vt = numOr(ta[hid],0); }
      else { va = lb[hid]; vt = numOr(tb[hid],0); }
      row[hid] = va; rowT[hid] = vt;
    });
    if(Object.keys(row).length){ outLog[d]=row; outTs[d]=rowT; }
  });
  return {log:outLog, ts:outTs};
}

function mergeDB(a, b){
  a = a || blankDB(); b = b || blankDB();
  var tomb = mergeTomb(a.tomb, b.tomb);
  var hl = mergeHabitLog(a.habits&&a.habits.log, a.habits&&a.habits.ts,
                         b.habits&&b.habits.log, b.habits&&b.habits.ts, tomb);
  var ca = a.createdAt, cb = b.createdAt;
  return {
    version: 2,
    createdAt: (ca && cb) ? (ca<cb?ca:cb) : (ca||cb),
    lastExport: (a.lastExport && b.lastExport)
      ? (a.lastExport>b.lastExport ? a.lastExport : b.lastExport)
      : (a.lastExport||b.lastExport||null),
    tomb: tomb,
    daily:  mergeRecordMap(a.daily,  b.daily,  'daily',  tomb),
    tasks:  mergeArrays(a.tasks,     b.tasks,  'task',   tomb),
    notes:  mergeArrays(a.notes,     b.notes,  'note',   tomb),
    goals:  mergeArrays(a.goals,     b.goals,  'goal',   tomb),
    /* 漏一张表 = 一同步那张表就没了：合并结果是"新对象"，
       没被列出来的集合在里面根本不存在，normalize 再把它补成空数组就存下去了。
       decisions / projects 曾经就这样漏在这儿 —— 补上，并在 [66] 加了逐表检查。 */
    decisions: mergeArrays(a.decisions, b.decisions, 'decision', tomb),
    projects:  mergeArrays(a.projects,  b.projects,  'project',  tomb),
    reflects:  mergeArrays(a.reflects,  b.reflects,  'reflect',  tomb),
    weekly: mergeRecordMap(a.weekly, b.weekly, 'weekly', tomb),
    habits: {
      config: mergeArrays(a.habits&&a.habits.config, b.habits&&b.habits.config,
                          'habit', tomb, function(x,y){
        var ox = numOr(x.ord, 999), oy = numOr(y.ord, 999);
        if(ox !== oy) return ox - oy;             /* 习惯顺序要稳定，不能按 id 排 */
        return x.id<y.id ? -1 : (x.id>y.id ? 1 : 0);
      }),
      log: hl.log,
      ts: hl.ts
    }
  };
}

var SYNC_KEY = 'life_records_sync_v1';

function timeAgo(ts){

  if(s < 10) return '刚刚';
  if(s < 60) return s+' 秒前';
  if(s < 3600) return Math.floor(s/60)+' 分钟前';
  if(s < 86400) return Math.floor(s/3600)+' 小时前';
  return Math.floor(s/86400)+' 天前';

/* ---------------- 可选：客户端加密 ---------------- */
function subtleCrypto(){

function encAvailable(){ return !!subtleCrypto() && typeof TextEncoder!=='undefined'; }
function bytesToB64(buf){

  for(var i=0;i<b.length;i++) s += String.fromCharCode(b[i]);

}
function b64ToBytes(str){

  for(var i=0;i<s.length;i++) a[i] = s.charCodeAt(i);

  if(!sc) throw new Error('当前环境不支持加密，请改用未加密模式');
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var key = await deriveKey(pass, salt);
  var ct = await sc.encrypt({name:'AES-GCM', iv:iv}, key, new TextEncoder().encode(text));
  return JSON.stringify({ app:'life-records', v:2, enc:'AES-GCM', kdf:'PBKDF2-SHA256-150000',
                          salt:bytesToB64(salt), iv:bytesToB64(iv), data:bytesToB64(ct) });
}
async function decPayload(json, pass){
  var sc = subtleCrypto();
  if(!sc) throw new Error('当前环境不支持解密');
  var o;
  try{ o = JSON.parse(json); }catch(e){ throw new Error('云端内容不是合法 JSON'); }
  if(!o || o.enc!=='AES-GCM') throw new Error('云端内容不是本应用加密的数据');
  var key = await deriveKey(pass, b64ToBytes(o.salt));
  var pt;
  try{
    pt = await sc.decrypt({name:'AES-GCM', iv:b64ToBytes(o.iv)}, key, b64ToBytes(o.data));
  }catch(e){
    throw new Error('解密失败：同步密码不对，或云端数据已损坏');
  }
  return new TextDecoder().decode(pt);
}
function isEncryptedPayload(text){
  if(!text) return false;
  var t = String(text).trim();
  if(t.charAt(0) !== '{') return false;
  try{ var o = JSON.parse(t); return !!(o && o.app==='life-records' && o.enc); }
  catch(e){ return false; }
}

/* ---------------- HTTP ---------------- */
async function httpJSON(url, opts){
  var r = await fetch(url, opts);
  var txt = await r.text();
  var data = null;
  try{ data = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok){
    var msg = (data && (data.message || data.error || data.error_description)) || ('HTTP '+r.status);
    var err = new Error(msg);
    err.status = r.status;
    throw err;
  }
  return data;
}

/* ---------------- GitHub Gist 适配器（已实测可用） ---------------- */
function ghHeaders(){
  return { 'Authorization':'Bearer '+SYNC.token,
           'Accept':'application/vnd.github+json',
           'X-GitHub-Api-Version':'2022-11-28',
           'Content-Type':'application/json' };
}
async function ghTest(){
  var me = await httpJSON('https://api.github.com/user', {headers:ghHeaders()});
  return '已连接 GitHub：' + ((me && me.login) || '(未知账号)');
}
/* 在账号里找已有的同步片段。
   为什么需要这个：第二台设备只填了令牌、没有片段 ID，
   如果直接开始同步，它会"找不到云端数据 → 以为是空的 → 新建一个片段"，
   结果两台设备各有一朵云，永远同步不到一起。
   换令牌时同理：令牌变了会把片段 ID 作废，这里能自动找回来。 */
async function ghFindGist(){
  var list = await httpJSON('https://api.github.com/gists?per_page=100', {headers:ghHeaders()});
  if(!Array.isArray(list)) return null;
  for(var i=0;i<list.length;i++){
    var g = list[i];
    if(g && g.id && g.files && g.files[SYNC.file]) return g.id;
  }
  return null;
}

async function ghPull(){  if(!SYNC.gistId) return null;
  var d = await httpJSON('https://api.github.com/gists/'+encodeURIComponent(SYNC.gistId),
                         {headers:ghHeaders()});
  var f = d && d.files && d.files[SYNC.file];
  if(!f) return null;
  if(f.truncated) throw new Error('云端文件超过 1MB 被 GitHub 截断，无法安全同步');
  return f.content || null;
}
async function ghPush(text){
  var files = {}; files[SYNC.file] = { content: text };
  if(!SYNC.gistId){
    var c = await httpJSON('https://api.github.com/gists', {
      method:'POST', headers:ghHeaders(),
      body: JSON.stringify({ description:'我的记录表 · 自动同步（请勿手动编辑）',
                             'public':false, files:files })
    });
    SYNC.gistId = c && c.id; saveSync();
    return;
  }
  await httpJSON('https://api.github.com/gists/'+encodeURIComponent(SYNC.gistId), {
    method:'PATCH', headers:ghHeaders(), body: JSON.stringify({ files: files })
  });
}

/* ---------------- Gitee 码云适配器 ----------------
   Gitee 没有机器可读的接口规范，body 该用表单还是 JSON 无法预先确定，
   所以两种都试，哪种通了就记住哪种（结果存在 giteeMode 里）。 */
function gtUrl(path){
  return 'https://gitee.com/api/v5' + path +
    (path.indexOf('?')>=0 ? '&' : '?') + 'access_token=' + encodeURIComponent(SYNC.token);
}
function formEncode(o){
  return Object.keys(o).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(o[k]);
  }).join('&');
}
async function gtTest(){
  var me = await httpJSON(gtUrl('/user'), {});
  return '已连接 Gitee：' + ((me && (me.login || me.name)) || '(未知账号)');
}
async function gtPull(){
  if(!SYNC.gistId) return null;
  var d = await httpJSON(gtUrl('/gists/'+encodeURIComponent(SYNC.gistId)), {});
  var files = d && d.files;
  if(!files) return null;
  var f = files[SYNC.file];
  if(f==null) return null;
  return (typeof f === 'string') ? f : (f.content || null);
}
/* 同 ghFindGist：Gitee 这边也要能自己找到已有的片段 */
async function gtFindGist(){
  var d = await httpJSON(gtUrl('/gists?per_page=100'), {});
  var list = Array.isArray(d) ? d : (d && Array.isArray(d.gists) ? d.gists : []);
  for(var i=0;i<list.length;i++){
    var g = list[i];
    if(g && (g.id || g.gist_id) && g.files && g.files[SYNC.file]) return g.id || g.gist_id;
  }
  return null;
}
async function gtWrite(build){
  var modes = (SYNC.giteeMode==='json') ? ['json','form'] : ['form','json'];
  var lastErr = null;
  for(var i=0;i<modes.length;i++){
    var spec = build(modes[i]);
    try{
      var r = await httpJSON(spec.url, spec.opts);
      if(SYNC.giteeMode !== modes[i]){ SYNC.giteeMode = modes[i]; saveSync(); }
      return r;
    }catch(e){
      lastErr = e;
      /* 只有"参数不被接受"才换编码重试；401/403 是令牌问题，重试没意义 */
      var retryable = e.status && e.status>=400 && e.status<500 && e.status!==401 && e.status!==403;
      if(!retryable) throw e;
    }
  }
  throw lastErr || new Error('Gitee 请求失败');
}
function gtBuildFiles(text, mode){
  if(mode==='json'){
    var files = {}; files[SYNC.file] = { content: text };
    return files;
  }
  var f = {}; f['files['+SYNC.file+']'] = text;
  return f;
}
async function gtPush(text){
  var desc = '我的记录表 · 自动同步（请勿手动编辑）';
  if(!SYNC.gistId){
    var c = await gtWrite(function(mode){
      if(mode==='json'){
        var body = { description:desc, 'public':false, files:gtBuildFiles(text, mode) };
        return { url:gtUrl('/gists'),
                 opts:{ method:'POST', headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(body) } };
      }
      var f = gtBuildFiles(text, mode);
      f.description = desc; f['public'] = 'false';
      return { url:gtUrl('/gists'),
               opts:{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
                      body:formEncode(f) } };
    });
    SYNC.gistId = c && (c.id || c.gist_id); saveSync();
    return;
  }
  await gtWrite(function(mode){
    var url = gtUrl('/gists/'+encodeURIComponent(SYNC.gistId));
    if(mode==='json'){
      return { url:url, opts:{ method:'PATCH', headers:{'Content-Type':'application/json'},
               body:JSON.stringify({ files:gtBuildFiles(text, mode) }) } };
    }
    return { url:url, opts:{ method:'PATCH',
             headers:{'Content-Type':'application/x-www-form-urlencoded'},
             body:formEncode(gtBuildFiles(text, mode)) } };
  });
}

function remoteTest(){ return SYNC.provider==='gitee' ? gtTest() : ghTest(); }
function remotePull(){ return SYNC.provider==='gitee' ? gtPull() : ghPull(); }
function remotePush(t){ return SYNC.provider==='gitee' ? gtPush(t) : ghPush(t); }
function remoteFind(){ return SYNC.provider==='gitee' ? gtFindGist() : ghFindGist(); }
function providerName(){ return SYNC.provider==='gitee' ? 'Gitee 码云' : 'GitHub'; }

/* ---------------- 同步主流程：拉取 → 合并 → 回推 ---------------- */
async function syncNow(opts){
  opts = opts || {};
  if(!SYNC.token){ if(opts.manual) toast('请先填写访问令牌并保存','err'); return false; }
  if(syncBusy){ if(opts.manual) toast('正在同步中，稍等'); return false; }
  if(typeof fetch !== 'function'){ if(opts.manual) toast('当前环境不支持网络请求','err'); return false; }
  syncBusy = true;
  setSyncStatus('busy','同步中…');
  try{
    /* 没有片段 ID 时先找一遍已有的。
       第二台设备、或者换过令牌的情况下，这一步决定了两台设备是"共用一朵云"
       还是"各建一朵云、永远同步不到一起"。 */
    if(!SYNC.gistId){
      try{
        var found = await remoteFind();
        if(found){ SYNC.gistId = found; saveSync(); }
      }catch(e){ /* 找不到就当没有，下面会新建一个 */ }
    }

    var raw = await remotePull();
    var remote = null, remoteHash = null;
    if(raw){
      var plain = raw;
      if(isEncryptedPayload(raw)){
        if(!SYNC.pass) throw new Error('云端数据是加密的，请先填写同步密码');
        plain = await decPayload(raw, SYNC.pass);
      }
      remote = normalize(JSON.parse(plain));
      remoteHash = hashDB(remote);
    }

    var beforeHash = hashDB(DB);
    var merged = remote ? mergeDB(DB, remote) : DB;
    var mergedHash = hashDB(merged);
    var localChanged = mergedHash !== beforeHash;     /* 云端有本地没有的 */
    var remoteChanged = mergedHash !== remoteHash;    /* 本地有云端没有的 */

    if(localChanged){
      suppressSync = true;
      DB = merged;
      save(true);
      suppressSync = false;
    }
    if(remoteChanged){
      var out = JSON.stringify(merged);
      if(SYNC.encrypt){
        if(!SYNC.pass) throw new Error('开启了加密但没有填写同步密码');
        out = await encPayload(out, SYNC.pass);
      }
      if(out.length > 900000){
        throw new Error('数据已接近云端 1MB 上限（' + Math.round(out.length/1024) + 'KB），请检查内容');
      }
      await remotePush(out);
    }

    SYNC.lastAt = Date.now();
    SYNC.lastHash = mergedHash;
    SYNC.lastError = '';
    saveSync();
    setSyncStatus('ok','已同步');
    if(localChanged){ render(); toast('已从云端合并更新','ok'); }
    else if(opts.manual) toast(remoteChanged ? '已上传本地更新' : '已是最新，无需同步','ok');
    return true;
  }catch(e){
    SYNC.lastError = String((e && e.message) || e);
    saveSync();
    setSyncStatus('err','同步失败');
    if(opts.manual) toast('同步失败：'+SYNC.lastError,'err');
    return false;
  }finally{
    syncBusy = false;
    if(TAB==='data'){ updateSyncCardLive(); } else { updateSyncPill(); }
  }
}

async function testConnection(manual){
  if(!SYNC.token){ toast('请先填写访问令牌','err'); return false; }
  setSyncStatus('busy','测试中…');
  try{
    var msg = await remoteTest();
    SYNC.lastError = '';
    saveSync();
    setSyncStatus('ok','连接正常');
    if(manual) toast(msg,'ok');
    return true;
  }catch(e){
    SYNC.lastError = String((e && e.message) || e);
    saveSync();
    setSyncStatus('err','连接失败');
    if(manual) toast('连接失败：'+SYNC.lastError,'err');
    return false;
  }finally{
    if(TAB==='data') updateSyncCardLive();
  }
}

/* ---------------- 自动同步调度 ---------------- */
function scheduleSync(){
  if(suppressSync) return;
  if(!SYNC.auto || !SYNC.token) return;
  clearTimeout(syncTimer);
  var since = Date.now() - lastAutoSync;
  syncTimer = setTimeout(function(){
    /* 本地内容没变就别推了 —— 只是翻页看看也会触发 save，那样会白白消耗接口额度 */
    if(SYNC.lastHash && hashDB(DB) === SYNC.lastHash) return;
    lastAutoSync = Date.now();
    syncNow({});
  }, Math.max(SYNC_DEBOUNCE, SYNC_MIN_GAP - since));
}
function startPoll(){
  clearInterval(pollTimer);
  if(!SYNC.auto || !SYNC.token) return;
  pollTimer = setInterval(function(){
    if(document.hidden) return;                        /* 后台标签页不轮询，省流量省额度 */
    if(syncBusy) return;
    if(Date.now() - lastAutoSync < SYNC_MIN_GAP) return;
    lastAutoSync = Date.now();
    syncNow({});
  }, SYNC_POLL);
}
function stopPoll(){ clearInterval(pollTimer); pollTimer = null; }

function updateSyncPill(){
  var el = $('#syncPill'), tx = $('#syncText');
  if(!el || !tx) return;
  if(!SYNC.token){ el.className = 'pill clickable s-off'; tx.textContent = '未开启同步'; return; }
  if(syncBusy){ el.className = 'pill clickable busy'; tx.textContent = '同步中…'; return; }
  if(SYNC.lastError){ el.className = 'pill clickable s-err'; tx.textContent = '同步失败'; return; }
  el.className = 'pill clickable s-ok';
  tx.textContent = SYNC.lastAt ? ('已同步 ' + timeAgo(SYNC.lastAt)) : '待同步';
}
function setSyncStatus(state, text){
  var el = $('#syncPill'), tx = $('#syncText');
  if(el && tx){
    el.className = 'pill clickable ' +
      (state==='ok' ? 's-ok' : state==='err' ? 's-err' : state==='busy' ? 'busy' : 's-off');
    tx.textContent = text;
  }
  var d = $('#syncCardState');
  if(d) d.className = 'sync-dot ' + (state==='ok'?'on':state==='err'?'err':state==='busy'?'busy':'');
  var t = $('#syncCardText');
  if(t) t.textContent = text;
  var la = $('#syncLastAt');
  if(la && SYNC.lastAt) la.textContent = timeAgo(SYNC.lastAt);
  var ea = $('#syncErrBox');
  if(ea) ea.style.display = SYNC.lastError ? '' : 'none';
  var et = $('#syncErrText');
  if(et) et.textContent = SYNC.lastError || '';
}
/* 数据页上的同步卡：只更新会变的那几个节点，不整页重绘（否则会打断正在输入的令牌） */
function updateSyncCardLive(){
  if(!$('#syncCardState')){ updateSyncPill(); return; }
  updateSyncPill();
  setSyncStatus(syncBusy ? 'busy' : (SYNC.lastError ? 'err' : (SYNC.lastAt ? 'ok' : 'idle')),
                syncBusy ? '同步中…' : (SYNC.lastError ? '同步失败' : (SYNC.lastAt ? '已同步' : '待同步')));
  var gid = $('#syncGistId');
  if(gid) gid.textContent = SYNC.gistId || '（首次同步时自动创建）';
}
function disconnectSync(){
  if(!confirm('断开云同步？\n\n数据仍会留在这台电脑上，云端那份也不会被删。\n之后可以重新填令牌接回来。')) return;
  SYNC.token = ''; SYNC.gistId = ''; SYNC.pass = '';
  SYNC.lastAt = 0; SYNC.lastHash = ''; SYNC.lastError = '';
  saveSync();
  stopPoll(); clearTimeout(syncTimer);
  setSyncStatus('off','未开启同步');
  toast('已断开云同步');
  render();
}

/* ---------------- 图表 ---------------- */
function smoothPath(pts, top, bottom){
  if(!pts.length) return '';
  if(pts.length < 3){
    return pts.map(function(p,i){ return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); }).join(' ');
  }
  var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(var i=0;i<pts.length-1;i++){
    var p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    var c1y = p1[1] + (p2[1]-p0[1])/6;
    var c2y = p2[1] - (p3[1]-p1[1])/6;
    /* 限制在绘图区内，避免平滑曲线冲出去产生"数值超出范围"的错觉 */
    c1y = Math.max(top, Math.min(bottom, c1y));
    c2y = Math.max(top, Math.min(bottom, c2y));
    d += ' C' + (p1[0] + (p2[0]-p0[0])/6).toFixed(1) + ' ' + c1y.toFixed(1) + ','
       + (p2[0] - (p3[0]-p1[0])/6).toFixed(1) + ' ' + c2y.toFixed(1) + ','
       + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
  }
  return d;
}

function lineChartSVG(dates, series, opt, chartId){
  opt = opt || {};
  var W = 700, H = 210;
  var pad = {l:34, r:16, t:16, b:28};
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var yMin = (opt.yMin!=null) ? opt.yMin : 0;
  var yMax = (opt.yMax!=null) ? opt.yMax : 5;
  var n = dates.length;
  var top = pad.t, bottom = pad.t + ih;
  function X(i){ return n<=1 ? pad.l+iw/2 : pad.l + iw*i/(n-1); }
  function Y(v){ return pad.t + ih - (v-yMin)/(yMax-yMin)*ih; }

  if(chartId) CHARTS[chartId] = {dates:dates, series:series, W:W, pad:pad, iw:iw, n:n, X:X, Y:Y};

  var s = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img">';
  s += '<defs>';
  series.forEach(function(ser, si){
    s += '<linearGradient id="g_'+(chartId||'c')+'_'+si+'" x1="0" y1="0" x2="0" y2="1">'
       + '<stop offset="0%" stop-color="'+ser.color+'" stop-opacity="0.24"/>'
       + '<stop offset="100%" stop-color="'+ser.color+'" stop-opacity="0"/>'
       + '</linearGradient>';
  });
  s += '</defs>';

  (opt.ticks||[]).forEach(function(t){
    var y = Y(t);
    s += '<line x1="'+pad.l+'" y1="'+y.toFixed(1)+'" x2="'+(W-pad.r)+'" y2="'+y.toFixed(1)+'"'
       + ' stroke="currentColor" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="3 4"/>';
    s += '<text x="'+(pad.l-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11"'
       + ' fill="currentColor" fill-opacity="0.38" font-weight="600">'+t+'</text>';
  });

  var step = n<=8 ? 1 : (n<=16 ? 2 : Math.ceil(n/8));
  dates.forEach(function(d,i){
    if(i%step===0 || i===n-1){
      s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5"'
         + ' fill="currentColor" fill-opacity="0.38" font-weight="600">'+esc(fmtShort(d))+'</text>';
    }
  });

  series.forEach(function(ser, si){
    var segs = [], cur = [];
    ser.values.forEach(function(v,i){
      if(v==null || isNaN(v)){ if(cur.length){ segs.push(cur); cur=[]; } }
      else cur.push([X(i), Y(v), v, i]);
    });
    if(cur.length) segs.push(cur);

    segs.forEach(function(seg){
      if(seg.length>1){
        var dAttr = smoothPath(seg, top, bottom);
        s += '<path class="ar" d="'+dAttr+' L'+seg[seg.length-1][0].toFixed(1)+' '+bottom.toFixed(1)
           + ' L'+seg[0][0].toFixed(1)+' '+bottom.toFixed(1)+' Z"'
           + ' fill="url(#g_'+(chartId||'c')+'_'+si+')" stroke="none"/>';
        s += '<path class="ln" d="'+dAttr+'" fill="none" stroke="'+ser.color+'" stroke-width="2.6"'
           + ' stroke-linecap="round" stroke-linejoin="round"/>';
      }
      seg.forEach(function(p){
        s += '<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'"'
           + ' r="'+(seg.length===1?4:3)+'" fill="var(--surface)" stroke="'+ser.color+'" stroke-width="2.2"/>';
      });
    });
  });

  s += '</svg>';
  return s;
}

/* 悬停提示：把鼠标位置换算成数据下标 */
function chartHover(box, clientX){
  var id = box.getAttribute('data-chart');
  var c = CHARTS[id]; if(!c) return;
  var svg = box.querySelector('svg'); if(!svg) return;
  var rect = svg.getBoundingClientRect();
  if(!rect.width) return;
  var sx = (clientX - rect.left) / rect.width * c.W;
  var i = c.n<=1 ? 0 : Math.round((sx - c.pad.l) / c.iw * (c.n-1));
  i = Math.max(0, Math.min(c.n-1, i));

  var leftPct = (c.X(i) / c.W) * 100;
  var cross = box.querySelector('.chart-cross');
  if(cross){ cross.style.left = leftPct + '%'; cross.style.opacity = '1'; }
  var tip = box.querySelector('.chart-tip');
  if(!tip) return;

  var html = '<div class="tt-d">'+esc(fmtShort(c.dates[i])+' '+dowCN(c.dates[i]))+'</div>';
  var rows = 0;
  c.series.forEach(function(ser){
    var v = ser.values[i];
    if(v==null || isNaN(v)) return;
    rows++;
    html += '<div class="tt-r"><i style="background:'+ser.color+'"></i>'+esc(ser.name)+' <b>'+r1(v)+'</b></div>';
  });
  if(!rows) html += '<div class="tt-r" style="opacity:.6">这天没有记录</div>';
  tip.innerHTML = html;
  tip.style.opacity = '1';

  /* 靠边时把提示框拉回可视区内 */
  var boxW = box.getBoundingClientRect().width || rect.width;
  var tipW = tip.offsetWidth || 130;
  var px = (leftPct/100) * boxW;
  var clamped = Math.max(tipW/2 + 2, Math.min(boxW - tipW/2 - 2, px));
  tip.style.left = clamped + 'px';
  tip.style.transform = 'translateX(-50%)';
}
function chartLeave(box){
  var cross = box.querySelector('.chart-cross');
  var tip = box.querySelector('.chart-tip');
  if(cross) cross.style.opacity = '0';
  if(tip) tip.style.opacity = '0';
}

  lastNDates(7, date).forEach(function(rd){
    var x = dpeek(rd);
    var has = hasDaily(rd);
    var moodC = (has && num(x.mood)) ? ['#e5484d','#f76b15','#e8b004','#46a758','#12a594'][num(x.mood)-1] : 'transparent';

/* ==========================================================================
   项目 —— 借鉴 每日工作台的「项目」表
   任务回答"我现在做什么"，项目回答"这条线走到哪了"。
   两者是一张表的两个视角，所以放在任务页里切换，不额外占导航位。
   ========================================================================== */
var PROJ_STATUS = ['进行中','已完成','暂停','放弃'];
var PROJ_BADGE = { '进行中':'b-blue','已完成':'b-green','暂停':'b-amber','放弃':'b-gray' };

function projectsAll(){
  return alive(DB.projects).slice().sort(function(a, b){
    var sa = a.status === '已完成' ? 1 : 0, sb = b.status === '已完成' ? 1 : 0;
    if(sa !== sb) return sa - sb;                       /* 完成的项目沉到底 */
    var da = a.due || '9999-99-99', db2 = b.due || '9999-99-99';
    return da < db2 ? -1 : (da > db2 ? 1 : 0);          /* 快到期的排前 */
  });
}
function projectStats(name){
  var list = alive(DB.tasks).filter(function(t){ return (t.project || '') === name; });
  var done = list.filter(function(t){ return t.status === '完成'; }).length;
  return {
    total: list.length, done: done, open: list.length - done,
    over: list.filter(isOverdue).length,
    pct: list.length ? Math.round(done * 100 / list.length) : 0
  };
}
function projDaysLeft(p){
  return p.due ? daysBetween(todayStr(), p.due) : null;
}
function projProgress(p){
  var v = num(p.progress);
  if(v != null) return Math.max(0, Math.min(100, v));
  return projectStats(p.name).pct;                      /* 没手填就按任务完成度算 */
}
/* 改项目名时，把关联任务的 project 字段一起改，否则链接会断 */
function renameProjectTasks(oldName, newName){
  if(!oldName || oldName === newName) return 0;
  var n = 0;
  alive(DB.tasks).forEach(function(t){
    if((t.project || '') === oldName){ t.project = newName; touch(t); n++; }
  });
  if(n) save(true);
  return n;
}

function projectHTML(p){
  var st = projectStats(p.name);
  var prog = projProgress(p);
  var left = projDaysLeft(p);
  var late = p.status !== '已完成' && p.status === '进行中' && left != null && left < 0;
  var h = '<div class="prj' + (p.status === '已完成' ? ' done' : '') + '">';
  h += '<div class="row" style="align-items:flex-start;gap:9px;flex-wrap:nowrap">';
  h += '<div style="flex:1;min-width:0">';
  h += '<div class="prj-t">' + esc(p.name || '(未命名)') + '</div>';
  h += '<div class="row" style="gap:6px;margin-top:6px">';
  h += '<span class="badge ' + (PROJ_BADGE[p.status] || 'b-gray') + '">' + esc(p.status || '进行中') + '</span>';
  if(p.prio) h += '<span class="badge ' + (PRIO_BADGE[p.prio] || 'b-gray') + '">' + esc(p.prio) + '</span>';
  if(left != null){
    h += '<span class="badge ' + (late ? 'b-red' : (left <= 7 ? 'b-amber' : 'b-gray')) + '">'
       + (late ? ('逾期 ' + (-left) + ' 天') : (left === 0 ? '今天截止' : ('还有 ' + left + ' 天')))
       + '</span>';
  }
  h += '<span style="font-size:11.5px;color:var(--text-3);font-weight:600">任务 '
     + st.done + '/' + st.total + '</span>';
  if(st.over) h += '<span class="badge b-red">逾期 ' + st.over + '</span>';
  h += '</div></div>';
  h += '<button class="btn sm ico ghost" data-act="prj-edit" data-id="' + esc(p.id) + '" title="编辑" aria-label="编辑">✏️</button>';
  h += '<button class="btn sm ico ghost" data-act="prj-del" data-id="' + esc(p.id) + '" title="删除" aria-label="删除">✕</button>';
  h += '</div>';

  if(p.goal) h += '<div class="prj-row"><span class="pk">目标</span><span class="pv">' + esc(p.goal) + '</span></div>';
  if(p.milestone) h += '<div class="prj-row"><span class="pk">里程碑</span><span class="pv">' + esc(p.milestone) + '</span></div>';
  if(p.risk) h += '<div class="prj-row"><span class="pk">风险</span><span class="pv" style="color:var(--warn)">' + esc(p.risk) + '</span></div>';
  if(p.note) h += '<div class="prj-row"><span class="pk">备注</span><span class="pv">' + esc(p.note) + '</span></div>';

  h += '<div class="row" style="margin-top:12px;flex-wrap:nowrap">';
  h += '<input type="range" min="0" max="100" step="5" value="' + prog + '" data-act="prj-prog"'
     + ' data-id="' + esc(p.id) + '" aria-label="进度" style="flex:1">';
  h += '<span class="pv num" style="font-weight:750;min-width:46px;text-align:right;font-size:14px">' + prog + '%</span>';
  h += '</div>';
  h += '<div class="bar"><i style="width:' + prog + '%;' + (p.status === '已完成' ? 'background:var(--ok)' : '') + '"></i></div>';

  h += '<div class="row" style="margin-top:11px;gap:7px">';
  PROJ_STATUS.forEach(function(s){
    if(s === p.status) return;
    h += '<button class="btn sm" data-act="prj-status" data-id="' + esc(p.id) + '" data-st="' + esc(s) + '">标为' + esc(s) + '</button>';
  });
  h += '<button class="btn sm ghost" data-act="prj-tasks" data-name="' + esc(p.name) + '">看它的任务 →</button>';
  h += '</div></div>';
  return h;
}

function viewProjects(){

  var h = '';

/* ==========================================================================
   重复任务 & 延期次数
   借鉴每日工作台的 nextRecurDate / 延期次数字段。
   重复任务的价值在于"周期性的事不用每次重记" —— 完成后自动排出下一次。
   ========================================================================== */
var REPEATS = ['不重复','每天','每周','每月'];
function nextRecurDate(date, repeat){
  if(!repeat || repeat === '不重复') return null;
  var d = parseD(date || todayStr());
  if(repeat === '每天') d.setDate(d.getDate() + 1);
  else if(repeat === '每周') d.setDate(d.getDate() + 7);
  else if(repeat === '每月') d.setMonth(d.getMonth() + 1);
  else return null;
  return fmtDate(d);
}
/* 完成一个重复任务 → 生成下一次；返回新记录（没有则返回 null） */
function rollRepeat(t){
  if(!t || !t.repeat || t.repeat === '不重复') return null;
  var next = nextRecurDate(t.date, t.repeat);
  if(!next) return null;
  var copy = {
    id: uid(), date: next, title: t.title, type: t.type, status: '进行中',
    prio: t.prio || '', project: t.project || '', repeat: t.repeat,
    updatedAt: Date.now()
  };
  if(t.estMin != null) copy.estMin = t.estMin;
  DB.tasks.push(copy);
  return copy;
}

/* ==========================================================================
   视图：任务
   ========================================================================== */
/* 任务计时器：点一下开始，再点一下停止，把实际耗时累加进去。
   同一时间只允许一个任务在跑 —— 否则数字就不真实了。 */
var timerTick = null;
function fmtDur(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return (h ? h+':' : '') + pad2(m) + ':' + pad2(ss);
}
function runningTask(){
  var list = alive(DB.tasks);
  for(var i=0;i<list.length;i++){ if(list[i].timerStart) return list[i]; }
  return null;
}
function toggleTimer(id){
  var run = runningTask();
  if(run && run.id === id){
    var mins = Math.max(1, Math.round((Date.now() - run.timerStart)/60000));
    run.minutes = (num(run.minutes) || 0) + mins;
    delete run.timerStart;
    touch(run); save(true);
    toast('记了 '+mins+' 分钟','ok');
    rerenderKeepScroll();
    return;
  }
  if(run){ toast('「'+String(run.title||'').slice(0,12)+'」还在计时，先停掉它','err'); return; }
  var t = findRec('task', id);
  if(!t) return;
  t.timerStart = Date.now();
  touch(t); save(true);
  toast('开始计时','ok');
  rerenderKeepScroll();
}
function startTimerTick(){
  clearInterval(timerTick);
  timerTick = setInterval(function(){
    $$('[data-timer]').forEach(function(el){
      var st = +el.getAttribute('data-timer');
      if(st) el.textContent = fmtDur(Date.now()-st);
    });
  }, 1000);
}

function taskItemHTML(t, o){
  o = o || {};
  var est = num(t.estMin), act = num(t.minutes);
  var running = !!t.timerStart;
  var over = isOverdue(t);
  var h = '<div class="item' + (o.sel ? ' picked' : '') + '"'
        + (running ? ' style="border-color:var(--m-task)"'
        : (over ? ' style="border-left-color:var(--bad)"' : '')) + '>'
        + '<div class="item-h">';
  /* 多选态：左边多一个勾选框。不开多选时它不存在，平时不多占一个像素 */
  if(o.sel){
    h += '<button class="selbox' + (o.picked ? ' on' : '') + '" data-act="task-sel"'
       + ' data-id="' + esc(t.id) + '" aria-pressed="' + (o.picked ? 'true' : 'false') + '"'
       + ' aria-label="选中这条">' + (o.picked ? '✓' : '') + '</button>';
  }
  h += '<div class="item-main">';
  h += '<div class="item-t">'+(t.pin?'<span class="ag-pin">★ </span>':'')+esc(t.title||'(未填事项)')+'</div>';
  h += '<div class="item-m">';
  if(over) h += '<span class="badge b-red">逾期 '+overdueDays(t)+' 天</span> ';
  if(t.prio) h += '<span class="badge '+(PRIO_BADGE[t.prio]||'b-gray')+'">'+esc(t.prio)+'</span> ';
  h += '<span class="badge '+(TYPE_BADGE[t.type]||'b-gray')+'">'+esc(t.type||'未分类')+'</span> ';
  h += '<span class="badge '+(ST_BADGE[t.status]||'b-gray')+'">'+esc(t.status||'—')+'</span>';
  if(t.project) h += ' <span class="badge b-gray">'+esc(t.project)+'</span>';
  if(t.repeat && t.repeat !== '不重复') h += ' <span class="badge b-blue">' + esc(t.repeat) + '</span>';
  if(num(t.deferCount)) h += ' <span class="badge b-amber">延期 ' + num(t.deferCount) + ' 次</span>';
  if(running){
    h += ' <span class="timer"><span class="tt run" data-timer="'+t.timerStart+'">'
       + fmtDur(Date.now()-t.timerStart)+'</span>计时中</span>';
  }
  /* 预计 vs 实际 —— 能看出自己的估算偏差，这是最实用的一条自省数据 */
  if(!running && (est!=null || act!=null)){
    h += ' <span style="color:var(--text-3);font-weight:600">';
    if(est!=null && act!=null){
      var ratio = est>0 ? act/est : null;
      var tone = ratio==null ? '' :
        (ratio>1.5 ? 'color:var(--bad)' : (ratio<0.7 ? 'color:var(--warn)' : 'color:var(--ok)'));
      h += '预计 '+est+' → 实际 <b style="'+tone+'">'+act+'</b> 分';
    }else if(act!=null){ h += act+' 分钟'; }
    else { h += '预计 '+est+' 分钟'; }
    h += '</span>';
  }
  if(num(t.drain)) h += ' <span style="color:var(--text-3);font-weight:600">耗能'+num(t.drain)+'</span>';
  if(t.output) h += '<div style="margin-top:6px">产出：<b>'+esc(t.output)+'</b></div>';
  if(t.blocker) h += '<div style="margin-top:4px;color:var(--warn);font-weight:600">卡点：'+esc(t.blocker)+'</div>';
  h += thumbRowHTML(t, 'task');
  h += '</div></div>';
  h += '<div class="item-date">'+esc(fmtShort(t.date))+'</div>';
  h += '<button class="btn sm ico ghost" data-act="task-timer" data-id="'+esc(t.id)+'"'
     + ' title="'+(running?'停止计时':'开始计时')+'" aria-label="计时">'+(running?'⏹':'⏱')+'</button>';
  h += '<button class="btn sm ico ghost'+(t.pin?' ag-pin':'')+'" data-act="task-pin" data-id="'+esc(t.id)+'"'
     + ' title="'+(t.pin?'取消钉选':'钉为今日三件')+'" aria-label="钉选">'+(t.pin?'★':'☆')+'</button>';
  h += '<button class="btn sm ico ghost" data-act="task-edit" data-id="'+esc(t.id)+'" title="编辑" aria-label="编辑">✏️</button>';
  h += '<button class="btn sm ico ghost" data-act="task-del" data-id="'+esc(t.id)+'" title="删除" aria-label="删除">✕</button>';
  h += '</div></div>';
  return h;
}

/* ==========================================================================
   任务：三种视图（清单 / 看板 / 日历）+ 批量操作
   同一批数据，三种看法：清单适合"逐条处理"，看板适合"看堆在哪"，
   日历适合"看这周排得下排不下"。切换不额外占导航位。
   ========================================================================== */
var TASK_LAYOUTS = [['list','清单'],['board','看板'],['cal','日历']];
var BOARD_ORDER = ['进行中','阻塞','完成'];
var BOARD_COLS = [
  { st:'进行中', color:'var(--accent)' },
  { st:'阻塞',   color:'var(--bad)'    },
  { st:'完成',   color:'var(--ok)'     }
];

/* 改状态统一入口：完成要补 doneDate、重复任务要排下一次，多处各写一遍早晚跑偏 */
function setTaskStatus(id, st){
  var t = findRec('task', id);
  if(!t || !st) return null;
  var wasDone = (t.status === '完成') && !!t.doneDate;
  t.status = st;
  if(st === '完成'){ if(!t.doneDate) t.doneDate = todayStr(); }
  else { delete t.doneDate; }
  touch(t);
  var nx = (!wasDone && st === '完成') ? rollRepeat(t) : null;
  save(true);
  return { rec:t, nx:nx };
}

/* 选中集合 —— 只认还在库里的，避免删完之后残留 id 让批量操作报错 */
function selIds(){
  return Object.keys(ui.sel || {}).filter(function(id){
    return ui.sel[id] && findRec('task', id);
  });
}
function selBarHTML(){
  var n = selIds().length;
  var dis = n ? '' : ' disabled';
  return '<div class="selbar">'
    + '<span class="sn">已选 ' + n + ' 条</span>'
    + '<button class="btn sm" data-act="task-sel-all">全选本页</button>'
    + '<button class="btn sm pri" data-act="task-batch" data-op="done"' + dis + '>✓ 完成</button>'
    + '<button class="btn sm" data-act="task-batch" data-op="date"' + dis + '>📅 改期</button>'
    + '<button class="btn sm danger" data-act="task-batch" data-op="del"' + dis + '>✕ 删除</button>'
    + '<button class="btn sm ghost" data-act="task-selmode">退出多选</button>'
    + '</div>';
}
/* 批量删除：一次撤销把整批都收回来，而不是只撤销最后一条 */
function batchDeleteTasks(ids){
  var recs = ids.map(function(id){ return findRec('task', id); }).filter(Boolean);
  if(!recs.length) return 0;
  var snap = recs.map(function(r){
    return { id:r.id, deleted:r.deleted, deletedAt:r.deletedAt, updatedAt:r.updatedAt };
  });
  recs.forEach(function(r){ softDelete('task', r.id); });
  ui.sel = {};
  save(true);
  toast('已删除 ' + recs.length + ' 条', '', '撤销', function(){
    snap.forEach(function(s){
      var r = findRec('task', s.id);
      if(!r) return;
      if(s.deleted === undefined) delete r.deleted; else r.deleted = s.deleted;
      if(s.deletedAt === undefined) delete r.deletedAt; else r.deletedAt = s.deletedAt;
      r.updatedAt = s.updatedAt;
    });
    save(true); render(); toast('已恢复','ok');
  });
  return recs.length;
}

/* ---- 看板 ---- */
function boardCardHTML(t){
  var over = isOverdue(t);
  var i = BOARD_ORDER.indexOf(t.status || '进行中');
  if(i < 0) i = 0;
  var h = '<div class="bcard' + (over ? ' late' : '') + (t.pin ? ' pin' : '') + '">';
  h += '<div class="bcard-t">' + (t.pin ? '★ ' : '') + esc(t.title || '(未填事项)') + '</div>';

/* ---- 日历 ---- */

  rows.forEach(function(t){

  var cfg = DB.habits.config;

  var h = '<div class="calbar">'
    + '<button class="btn sm ico" data-act="cal-prev" aria-label="上一周">‹</button>'
    + '<button class="btn sm ico" data-act="cal-next" aria-label="下一周">›</button>'
    + '<span class="calt">' + (+wk.split('-W')[1]) + ' 周 · '

  h += '</div>';

    h += '<section class="card tight" style="margin-bottom:14px">'

         + esc(fmtShort(t.date)) + '　' + esc(t.title || '(未填事项)')
         + '　· 逾期 ' + overdueDays(t) + ' 天</button>';
    });
    h += '</div></section>';

  h += '<div class="cal">';
  dates.forEach(function(d){

    h += '<div class="' + cls + '">';

       + '<span class="cal-n">' + esc(fmtShort(d)) + '</span>';

         + (t.pin ? '★ ' : '') + esc(t.title || '(未填事项)') + '</button>';
    });

      h += '<span class="cal-more">还有 ' + (list.length - show.length) + ' 条</span>';

/* 预计 vs 实际的整体偏差 */
function estAccuracy(tasks){
  var est = 0, act = 0, n = 0;
  (tasks||[]).forEach(function(t){
    if(num(t.estMin)!=null && num(t.minutes)!=null){ est += num(t.estMin); act += num(t.minutes); n++; }
  });
  return { n:n, est:est, act:act, ratio: est>0 ? act/est : null };
}

/* 列表 / 看板 / 日历三种视图共用同一批行 —— 只算一次，三处不会各算各的 */
function taskRows(){
  var date = ui.todayDate || todayStr();
  var wk = isoWeek(date);
  var dates = weekDates(wk);
  var weekTasks = tasksIn(dates);
  /* 逾期的事必然在过去，只按"本周"过滤就永远看不到它们。
     所以列表 = 所有未完成的 + 本周已完成的。 */
  var seenIds = {}, rows = [];
  openTasks().forEach(function(t){ if(!seenIds[t.id]){ seenIds[t.id]=1; rows.push(t); } });
  weekTasks.forEach(function(t){ if(!seenIds[t.id]){ seenIds[t.id]=1; rows.push(t); } });
  rows.sort(byUrgency);
  var all = rows.slice();
  if(ui.projectFilter) rows = rows.filter(function(t){ return (t.project || '') === ui.projectFilter; });
  if(ui.taskFilter!=='all') rows = rows.filter(function(t){ return t.type===ui.taskFilter; });
  return { rows:rows, all:all, weekTasks:weekTasks, dates:dates, wk:wk };
}

/* 热力图：12 周 × 7 天，比 30 天网格更容易一眼看出"哪段时间在坚持、哪段时间断了" */
function heatmapHTML(weeks){
  weeks = weeks || 12;
  var end = todayStr();
  var start = addDays(end, -(weeks*7 - 1));
  var cfg = DB.habits.config;
  var h = '<div class="heat">';
  for(var w=0; w<weeks; w++){
    h += '<div class="heat-col">';
    for(var d=0; d<7; d++){
      var day = addDays(start, w*7+d);
      if(day > end){ h += '<div class="heat-c" style="visibility:hidden"></div>'; continue; }
      var row = DB.habits.log[day];
      if(!row || !cfg.length){ h += '<div class="heat-c off"></div>'; continue; }
      var done = cfg.filter(function(hb){ return row[hb.id]===true; }).length;
      var lv = done===0 ? 0 : Math.max(1, Math.ceil(done/cfg.length*4));
      h += '<div class="heat-c'+(lv>0?(' l'+lv):'')+'" title="'+esc(fmtFull(day)+' · '+done+'/'+cfg.length)+'"></div>';
    }
    h += '</div>';
  }
  return h + '</div>';
}

  h += '<div class="item-m">';
  if(n.type) h += '<span class="badge b-blue">'+esc(n.type)+'</span> ';
  h += '<span class="badge '+stBadge+'">'+esc(n.status||'待整理')+'</span>';
  if(n.source) h += ' <span style="color:var(--text-3)">来源：'+esc(n.source)+'</span>';
  h += '</div>' + thumbRowHTML(n, 'note') + '</div>';
  h += '<div class="item-date">'+esc(fmtShort(n.date))+'</div>';
  h += '<button class="btn sm ico ghost" data-act="note-edit" data-id="'+esc(n.id)+'" title="编辑" aria-label="编辑">✏️</button>';
  h += '<button class="btn sm ico ghost" data-act="note-del" data-id="'+esc(n.id)+'" title="删除" aria-label="删除">✕</button>';

/* ==========================================================================
   视图：复盘
   ========================================================================== */
function buildSummaryText(wk){
  var s = weekSummary(wk);
  var prev = weekSummary(shiftWeek(wk,-1));
  function arrow(cur,pv){
    if(cur==null||pv==null) return '';
    var diff = cur-pv;
    if(Math.abs(diff)<0.05) return ' →';
    return diff>0 ? ' ↑' : ' ↓';
  }
  var lines = [];
  lines.push('【'+wk.replace('-W','年 第')+'周 复盘】'+fmtShort(s.dates[0])+' ~ '+fmtShort(s.dates[6]));
  lines.push('─────────────────────────');
  lines.push('记录天数：'+s.recorded+'/7');
  lines.push('平均心情 '+r1(s.mood)+arrow(s.mood,prev.mood)
           + '   平均能量 '+r1(s.energy)+arrow(s.energy,prev.energy)
           + '   平均睡眠 '+r1(s.sleep)+'h'+arrow(s.sleep,prev.sleep));
  lines.push('');
  lines.push('任务：共 '+s.taskTotal+' 条，完成 '+s.taskDone+'，阻塞 '+s.taskBlocked);
  lines.push('      救火占比 '+pct(s.fireRate)
           + (fireAlert(s.fireRate)?'  ⚠ 偏高（问题在流程，不在时间管理）':'')
           + '   总耗时 '+r1(s.minutes/60)+'h');
  lines.push('灵感：新增 '+s.noteNew+' 条，已整理/已用 '+s.noteDone+' 条');
  if(s.habitRates.length){
    lines.push('');
    lines.push('打卡率：' + s.habitRates.map(function(x){
      return x.name+' '+pct(x.rate);
    }).join('   '));
  }
  return lines.join('\n');
}

/* ==========================================================================
   复盘建议引擎
   诊断原话："进度概览有环形图、柱状图、趋势图、热力图四组，
   但没有任何一处回答『所以我现在该做什么』。"  —— 这一节就是那个回答。
   ========================================================================== */
function reviewAdvice(s, prev){
  var out = [];
  var rec = s.recorded;

  if(rec < 3){
    out.push({tone:'bad', t:'这周只记了 '+rec+' 天',
      d:'先别急着分析数据 —— 记录本身断了，后面所有统计都不准。'
      + '下周只定一个目标：每天打开一次，填三项就走。'});
  }else if(rec < 5){
    out.push({tone:'warn', t:'记录 '+rec+'/7 天，还不太稳',
      d:'差一点就能形成习惯。把入口绑在一个已有动作后面（关电脑前、刷牙后），比靠意志力管用。'});
  }

  if(fireAlert(s.fireRate)){
    out.push({tone:'bad', t:'救火占了 '+pct(s.fireRate)+'，这才是本周最大的问题',
      d:'超过 30% 说明你不是在推进事情，而是在被事情推着走。'
      + '根因通常是缺文档、缺监控、或缺人 —— 下周挑一件「再来一次就不用救」的事做掉。'});
  }else if(s.fireRate != null && s.fireRate >= 0.15){
    out.push({tone:'warn', t:'救火占比 '+pct(s.fireRate)+'，开始有点多了',
      d:'还在可控范围，但趋势值得盯。看看这些火烧的是不是同一类问题。'});
  }

  if(s.mood != null && prev && prev.mood != null && (prev.mood - s.mood) >= 0.5){
    out.push({tone:'warn', t:'心情比上周降了 '+r1(prev.mood - s.mood)+' 分',
      d:'先别找心理原因，先看睡眠 —— 睡眠要是也掉了，多半就是它。'});
  }
  if(s.sleep != null && s.sleep < 6.5 && s.recorded >= 3){
    out.push({tone:'warn', t:'平均睡眠只有 '+r1(s.sleep)+' 小时',
      d:'这个时长下心情和效率都会下滑，而你会误以为是「自己不够努力」。'});
  }

  var low = (s.habitRates||[]).filter(function(x){ return x.rate != null && x.rate < 0.3; });
  if(low.length >= 3){
    out.push({tone:'warn', t:'有 '+low.length+' 个习惯打卡率低于 30%',
      d:'不是你不自律 —— 是习惯设太多了。砍到 3 个以内，等这三个稳了再加。'});
  }

  if(s.taskTotal >= 3 && s.taskBlocked >= 2){
    out.push({tone:'warn', t:'有 '+s.taskBlocked+' 条任务卡着',
      d:'卡住的事不会自己好。要么这周推掉，要么明确放弃 —— 挂着最消耗人。'});
  }

  if(s.recorded >= 5 && s.taskTotal >= 5 && !fireAlert(s.fireRate) && (s.mood == null || s.mood >= 3.5)){
    out.push({tone:'good', t:'这周状态不错',
      d:'记录稳定、任务推进正常、没被救火拖住。保持就好，别急着加新东西。'});
  }

  if(!out.length){
    out.push({tone:'', t:'数据还不够看出规律', d:'再记一两周，这里会自动给出针对你的建议。'});
  }
  return out;
}
function adviceHTML(list){
  var h = '<section class="card">'
    + cardHead('💡','所以，下周该做什么','<span class="hint">从上面的数字推出来的</span>');
  list.forEach(function(a){
    var cls = a.tone==='bad' ? 'note bad' : (a.tone==='warn' ? 'note warn' : 'note');
    h += '<div class="'+cls+'" style="margin-bottom:10px"><span class="note-body">'
       + '<b>'+esc(a.t)+'</b><br>' + esc(a.d) + '</span></div>';
  });
  h += '</section>';
  return h;
}

/* ==========================================================================
   周报 Markdown —— 借鉴每日工作台的 weekMarkdown
   纯文本那份是给自己看的，Markdown 这份是能直接贴给别人的。
   ========================================================================== */
function weekMarkdown(wk){
  var s = weekSummary(wk);
  var prev = weekSummary(shiftWeek(wk,-1));
  var w = DB.weekly[wk] || {};
  var dates = weekDates(wk);
  var L = [];

  L.push('## ' + wk.replace('-W', ' 年第 ') + '周 · ' + fmtShort(dates[0]) + ' ~ ' + fmtShort(dates[6]));
  L.push('');

  L.push('### 本周数据');
  L.push('');
  L.push('| 指标 | 本周 | 上周 |');
  L.push('| --- | --- | --- |');
  L.push('| 记录天数 | ' + s.recorded + '/7 | ' + prev.recorded + '/7 |');
  L.push('| 平均心情 | ' + r1(s.mood) + ' | ' + r1(prev.mood) + ' |');
  L.push('| 平均能量 | ' + r1(s.energy) + ' | ' + r1(prev.energy) + ' |');
  L.push('| 平均睡眠 | ' + r1(s.sleep) + 'h | ' + r1(prev.sleep) + 'h |');
  L.push('| 任务完成 | ' + s.taskDone + '/' + s.taskTotal + ' | ' + prev.taskDone + '/' + prev.taskTotal + ' |');
  L.push('| 救火占比 | ' + pct(s.fireRate) + ' | ' + pct(prev.fireRate) + ' |');
  L.push('| 总耗时 | ' + r1(s.minutes/60) + 'h | ' + r1(prev.minutes/60) + 'h |');
  L.push('| 反省条数 | ' + s.reflectN + ' | ' + prev.reflectN + ' |');
  L.push('');

  var done = tasksIn(dates).filter(function(t){ return t.status === '完成'; });
  if(done.length){
    L.push('### 本周完成（' + done.length + ' 件）');
    L.push('');
    done.forEach(function(t){
      var line = '- ' + (t.prio ? '`' + t.prio + '` ' : '') + t.title;
      if(t.output) line += ' —— ' + t.output;
      if(t.project) line += '　_(' + t.project + ')_';
      L.push(line);
    });
    L.push('');
  }
  var blocked = tasksIn(dates).filter(function(t){ return t.status === '阻塞'; });
  if(blocked.length){
    L.push('### 卡住的（' + blocked.length + ' 件）');
    L.push('');
    blocked.forEach(function(t){
      L.push('- ' + t.title + (t.blocker ? ' —— 卡点：' + t.blocker : ''));
    });
    L.push('');
  }

  var notes = notesIn(dates);
  if(notes.length){
    L.push('### 本周灵感（' + notes.length + ' 条）');
    L.push('');
    notes.slice(0, 10).forEach(function(n){ L.push('- ' + String(n.content || '').replace(/\n/g, ' ')); });
    L.push('');
  }

  /* 反省单独一节：它是这一周里"我想明白了什么"，比流水账更值得回头看 */
  var refs = reflectsIn(dates);
  if(refs.length){
    L.push('### 本周反省（' + refs.length + ' 条）');
    L.push('');
    refs.slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; })
      .forEach(function(r){
        L.push('- **' + fmtShort(r.date) + '** ' + String(r.content || '').replace(/\n/g, ' '));
        if(r.decision) L.push('  - 关联决策：' + r.decision);
      });
    L.push('');
  }

  /* 自动建议也带上 —— 这才是"看完知道下一步"的部分 */
  L.push('### 值得注意的');
  L.push('');
  reviewAdvice(s, prev).forEach(function(a){
    L.push('- **' + a.t + '** —— ' + a.d);
  });
  L.push('');

  if(w.gain || w.problem || w.oneThing || w.todos){
    L.push('### 复盘');
    L.push('');
    if(w.gain) L.push('- **最大收获**：' + w.gain);
    if(w.problem) L.push('- **最大问题**：' + w.problem);
    if(w.oneThing) L.push('- **下周只做一件**：' + w.oneThing);
    if(w.todos){ L.push(''); L.push('下周待办：'); L.push(''); L.push(w.todos); }
    L.push('');
  }
  return L.join('\n');
}

function viewReview(){
  var wk = ui.week || isoWeek(ui.todayDate || todayStr());
  var mode = ui.reviewMode || 'week';

  var head = pageHead('review', {
    count: mode === 'reflect'
      ? (alive(DB.reflects).length + ' 条')

  h += '<section class="card">'
     + cardHead('🧮','自动汇总',
         '<button class="btn sm" data-act="copy-summary">复制纯文本</button>'
         + '<button class="btn sm pri" data-act="copy-markdown">复制为 Markdown</button>');
  h += '<div class="summary-wrap"><pre class="summary" id="sumBox">'+esc(buildSummaryText(wk))+'</pre></div>';

  h += '<div class="stats" style="margin-top:16px">';
  h += statHTML({icon:'📅', k:'记录天数', v:s.recorded, unit:'/7',
                 tone:s.recorded>=5?'good':(s.recorded>=3?'warn':'bad'),
                 bar:s.recorded/7*100});
  h += statHTML({icon:'🙂', k:'平均心情', v:r1(s.mood), d:'上周 '+r1(prev.mood)});
  h += statHTML({icon:'⚡', k:'平均能量', v:r1(s.energy), d:'上周 '+r1(prev.energy)});
  h += statHTML({icon:'😴', k:'平均睡眠', v:r1(s.sleep), unit:'h', d:'上周 '+r1(prev.sleep)+'h'});
  h += statHTML({icon:'✔️', k:'任务完成率', v:pct(s.taskTotal?s.taskDone/s.taskTotal:null), d:'共 '+s.taskTotal+' 条'});
  h += statHTML({icon:'🔥', k:'救火占比', v:pct(s.fireRate), tone:fireLevel(s.fireRate),
                 d:fireAlert(s.fireRate)?'⚠ 已达30%':''});
  h += '</div></section>';

  /* ★ 关键：数字之后直接给结论。之前这一页只有图没有话，看完不知道该干嘛 */
  h += adviceHTML(reviewAdvice(s, prev));

  h += '<section class="card">'
     + cardHead('✍️','你来写的三句话','<span class="hint">自动填不了的部分</span>');
  h += '<div class="field" style="margin-bottom:16px"><label class="f">① 本周最大的收获</label>'

  h += '</section>';

  var dates = lastNDates(30, ui.todayDate || todayStr());
  var moodS = dates.map(function(d){ var x=dpeek(d); return x?num(x.mood):null; });
  var enS   = dates.map(function(d){ var x=dpeek(d); return x?num(x.energy):null; });
  var slS   = dates.map(function(d){ var x=dpeek(d); return x?num(x.sleep):null; });

  h += '<section class="card">' + cardHead('📈','近 30 天趋势','<span class="hint">鼠标移到图上可看具体数值</span>');
  h += '<div style="color:var(--text)">'
     + chartBoxHTML('moodE', dates, [
         {name:'心情', color:'#5b5bd6', values:moodS},
         {name:'能量', color:'#f59e0b', values:enS}
       ], {yMin:0, yMax:5, ticks:[1,2,3,4,5]})
     + '</div>' + legendHTML([{name:'心情',color:'#5b5bd6'},{name:'能量',color:'#f59e0b'}]);
  h += '<div style="color:var(--text);margin-top:24px">'
     + chartBoxHTML('sleep', dates, [{name:'睡眠', color:'#0d9f6e', values:slS}],
        {yMin:0, yMax:12, ticks:[0,4,8,12]})
     + '</div>' + legendHTML([{name:'睡眠时长（小时）',color:'#0d9f6e'}]);
  h += '<div class="hint" style="margin-top:12px">空白处表示那天没记录。看出「什么在拖垮状态」比记住具体哪天重要得多。</div>';
  h += '</section>';

  var keys = Object.keys(DB.weekly).filter(function(k){
    var x = DB.weekly[k];
    return x && (x.gain||x.problem||x.oneThing);
  }).sort().reverse();
  if(keys.length){
    h += '<section class="card">' + cardHead('📚','往期复盘 · '+keys.length+' 篇','');
    keys.forEach(function(k){
      var x = DB.weekly[k];
      h += '<div class="item" style="cursor:pointer" data-act="week-goto" data-wk="'+esc(k)+'">';
      h += '<div class="item-t">'+esc(weekLabel(k))+'</div>';
      h += '<div class="item-m">';
      if(x.gain) h += '收获：'+esc(x.gain)+'<br>';
      if(x.problem) h += '问题：'+esc(x.problem)+'<br>';
      if(x.oneThing) h += '<b>下周一件：'+esc(x.oneThing)+'</b>';
      h += '</div></div>';
    });
    h += '</section>';
  }

  /* 目标并入复盘页 —— 一个往后看（复盘），一个往前看（目标），是同一件事的两面 */
  h += goalsSectionHTML();
  return h;
}

/* ==========================================================================
   目标（并入复盘页，不再单独占一个导航位）
   ========================================================================== */
function goalsSectionHTML(){
  var today = todayStr();
  var curQ = quarterOf(today), curM = monthOf(today);
  var goals = alive(DB.goals);
  var h = '<section class="card">'
    + cardHead('🎯','目标 · 本月 / 本季',
        '<button class="btn sm pri" data-act="new-goal">＋ 加一个</button>');

  if(!goals.length){
    h += emptyHTML('🎯','还没有目标',
      '建议第 2 个月再开始用这一块 —— 先把「每天打开记录」这个习惯养起来，再来谈方向');
    h += '</section>';
    return h;
  }

  var groups = {};
  goals.forEach(function(g){ (groups[g.period] = groups[g.period] || []).push(g); });
  Object.keys(groups).sort().reverse().forEach(function(p, gi){
    var isCur = (p===curQ || p===curM);
    h += '<div class="sec-title" style="margin:'+(gi?'22px':'4px')+' 0 12px">'
       + esc(p) + (isCur ? ' · 当前' : '') + '</div>';
    groups[p].forEach(function(g){ h += goalHTML(g); });
  });

  h += '<div class="note" style="margin-top:16px"><span class="note-body">'
     + '季度末对每个目标<b>只做一个决定：继续，或者放弃</b>。不许「挂着」——'
     + '挂着的目标会一路拖到年底，然后让你觉得这一年什么都没做成。</span></div>';
  h += '</section>';
  return h;
}

function goalHTML(g){
  var cls = g.status==='达成' ? ' st-done' : (g.status==='放弃' ? ' st-drop' : '');
  var prog = num(g.progress) || 0;
  var h = '<div class="goal'+cls+'">';
  h += '<div class="row" style="align-items:flex-start;gap:10px;flex-wrap:nowrap">';
  h += '<div style="flex:1;min-width:0">';
  h += '<div class="goal-t">'+esc(g.goal||'(无标题)')+'</div>';
  h += '<div class="row" style="gap:7px;margin-bottom:8px">';
  h += '<span class="badge b-blue">'+esc(g.area||'其他')+'</span>';
  h += '<span class="badge '+(g.status==='达成'?'b-green':(g.status==='放弃'?'b-gray':'b-amber'))+'">'
     + esc(g.status||'进行中')+'</span>';
  h += '</div>';
  if(g.krs) h += '<div class="item-m" style="margin:0">关键结果：'+esc(g.krs)+'</div>';
  if(g.review) h += '<div class="item-m" style="margin:6px 0 0">月末复盘：'+esc(g.review)+'</div>';
  h += '</div>';
  h += '<button class="btn sm ico ghost" data-act="goal-del" data-id="'+esc(g.id)+'" title="删除" aria-label="删除">✕</button>';
  h += '</div>';

  h += '<div class="row" style="margin-top:14px;flex-wrap:nowrap">';
  h += '<input type="range" min="0" max="100" step="5" value="'+prog+'" data-act="goal-prog"'
     + ' data-id="'+esc(g.id)+'" aria-label="进度" style="flex:1">';
  h += '<span class="pv num" style="font-weight:750;min-width:48px;text-align:right;font-size:15px">'+prog+'%</span>';
  h += '</div>';
  h += '<div class="bar"><i style="width:'+prog+'%;'+(g.status==='达成'?'background:var(--ok)':'')+'"></i></div>';

  h += '<div class="row" style="margin-top:12px">';
  ['进行中','达成','放弃'].forEach(function(st){
    if(st===g.status) return;
    h += '<button class="btn sm" data-act="goal-status" data-id="'+esc(g.id)+'" data-st="'+esc(st)+'">标为'+esc(st)+'</button>';
  });
  h += '<input type="text" placeholder="月末复盘：为什么达成/没达成" value="'+esc(g.review||'')+'"'
     + ' data-act="goal-review" data-id="'+esc(g.id)+'" style="flex:1;min-width:170px">';
  h += '</div></div>';
  return h;
}

/* ==========================================================================
   每日反省
   ---------------------------------------------------------------------------
   和「今日一句」不是一回事：那句是一天的总纲，反省是**具体的一件事或一个念头**，
   一天可以写好几条，还能挂到某个决策上 —— 半年后回头看，最值钱的正是这条链：
   「当时拍了这个板 → 后来怎么样了」。
   ========================================================================== */
function reflectsOn(date){
  return alive(DB.reflects).filter(function(r){ return r.date === date; })
    .sort(function(a,b){ return numOr(b.at,0) - numOr(a.at,0); });
}
function reflectsIn(dates){
  var set = {};
  dates.forEach(function(d){ set[d] = 1; });
  return alive(DB.reflects).filter(function(r){ return set[r.date]; });
}
function reflectAll(){
  return alive(DB.reflects).slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? 1 : -1;   /* 新的在前 */
    return numOr(b.at,0) - numOr(a.at,0);
  });
}
function reflectItemHTML(r){
  var dec = r.decision ? alive(DB.decisions).filter(function(d){ return d.title === r.decision; })[0] : null;
  var h = '<div class="item"><div class="item-h"><div class="item-main">';
  h += '<div class="item-t" style="white-space:pre-wrap;font-weight:520">' + esc(r.content || '') + '</div>';
  h += '<div class="item-m">';
  h += '<span class="badge b-gray">' + esc(fmtFull(r.date)) + '</span>';
  if(r.decision) h += ' <span class="badge b-blue">🧭 ' + esc(r.decision) + '</span>';
  if(dec && dec.conclusion) h += ' <span style="color:var(--text-3)">结论：' + esc(dec.conclusion) + '</span>';
  if(imgsOf(r).length) h += ' <span style="color:var(--text-3)">附图 ' + imgsOf(r).length + ' 张</span>';
  h += '</div>' + thumbRowHTML(r, 'reflect') + '</div>';
  h += '<button class="btn sm ico ghost" data-act="reflect-edit" data-id="' + esc(r.id) + '"'
     + ' title="编辑" aria-label="编辑">✏️</button>';
  h += '<button class="btn sm ico ghost" data-act="reflect-del" data-id="' + esc(r.id) + '"'
     + ' title="删除" aria-label="删除">✕</button>';
  h += '</div></div>';
  return h;
}
function viewReflects(){
  var list = reflectAll();
  var today = todayStr();
  var todayN = reflectsOn(today).length;
  var h = '';

  if(!list.length){
    return h + '<section class="card">' + emptyHTML('🪞',
      '还没有反省记录',
      '做完一件事、犯了一个错、或者想通一个道理的时候，写两三句。'
      + '它和「今日一句」不一样：那句话是一天的总纲，这里是一件具体的事',
      '<button class="btn pri" data-act="new-reflect">现在写一条</button>') + '</section>';
  }

  /* 按日期分组 —— 反省是按天长的东西，平铺一长串会看不出节奏 */
  var groups = [], cur = null;
  list.forEach(function(r){
    if(!cur || cur.date !== r.date){ cur = { date:r.date, items:[] }; groups.push(cur); }
    cur.items.push(r);
  });

  h += '<div class="stats" style="margin-bottom:18px">';
  h += statHTML({icon:'🪞', k:'反省总数', v:list.length});
  h += statHTML({icon:'📅', k:'写过的天数', v:groups.length});
  h += statHTML({icon:'🧭', k:'挂到决策上', v:list.filter(function(r){ return r.decision; }).length,
                 d:'有出处的那几条'});
  h += statHTML({icon:'📷', k:'附图', v:list.reduce(function(a,r){ return a + imgsOf(r).length; }, 0)});
  h += '</div>';

  if(todayN){
    h += '<div class="note" style="margin-bottom:16px"><span class="note-body">'
       + '今天已经写了 <b>' + todayN + '</b> 条。想到就补，不用攒到晚上。</span></div>';
  }

  groups.forEach(function(g){
    h += '<section class="card">'
       + cardHead('📆', fmtFull(g.date) + (g.date === today ? ' · 今天' : ''),
                  '<span class="hint">' + g.items.length + ' 条</span>');
    g.items.forEach(function(r){ h += reflectItemHTML(r); });
    h += '</section>';
  });
  return h;
}
/* 「今天」页上的入口：一天里最该被记下来的那句话，在这里当场写掉 */
function todayReflectHTML(){
  var date = ui.todayDate || todayStr();
  var list = reflectsOn(date);
  var h = '<section class="card">'
        + cardHead('🪞', '今日反省' + (list.length ? ' · ' + list.length + ' 条' : ''),
                   '<span class="hint">' + (list.length ? '想到就补' : '两三句就够') + '</span>');
  if(!ui.reflectOpen && !list.length){
    h += '<button class="btn" data-act="reflect-open" style="width:100%">＋ 写一条反省</button>';
    return h + '</section>';
  }
  h += '<div class="field"><textarea id="rf_quick" style="min-height:76px"'
     + ' placeholder="做完的事、犯的错、想通的道理 —— 写具体的那一件，不写感受">'
     + '</textarea></div>';
  h += '<div class="row" style="margin-top:11px">'
     + '<button class="btn pri sm" data-act="reflect-quick">记下来</button>'

     + (ui.reflectOpen ? '<button class="btn sm ghost" data-act="reflect-close">收起</button>' : '')
     + '</div>';
  list.forEach(function(r){ h += reflectItemHTML(r); });
  return h + '</section>';
}

/* 环境警告横幅：放在每个页面最上面。

function envWarningHTML(){
  if(!storageOK){
    return '<div class="note bad" style="margin-bottom:16px"><span class="note-body">'
      + '<b>数据存不下来！</b>浏览器拒绝了这个页面的本地存储，你记的东西<b>一关页面就没了</b>。'

      + '请先去「数据」页导出一份备份，再按上面的说明把它放到网址上。'
      + '</span><button class="btn sm" data-act="go" data-tab="data">去数据页</button></div>';
  }
  if(PWA.local && isMobileDevice()){
    return '<div class="note warn" style="margin-bottom:16px"><span class="note-body">'
      + '<b>你是从本地文件打开的，装不成 App。</b>'
      + 'Chrome 只允许从 <code class="k">https://</code> 网址安装应用 —— '
      + '所以右上角菜单里<b>根本不会出现「安装应用」</b>，这不是你操作的问题。'
      + '</span><button class="btn sm" data-act="go" data-tab="data">看怎么解决</button></div>';
  }

/* ==========================================================================
   装成 App（PWA）
   · 手机上：浏览器菜单「安装应用」→ 桌面图标，独立全屏，断网可用
   · 电脑上：Chrome/Edge 地址栏的「安装」图标 → 独立窗口 + 任务栏/开始菜单
   · 直接用 file:// 打开时这些都不生效，应用照常能用，只是拿不到"装成 App"的待遇
   ========================================================================== */
var PWA = { deferred:null, standalone:false, local:false };

/* 「不是从网址打开的」要判断得宽一点：
   桌面双击文件是 file:，但安卓上从文件管理器打开是 content:（或其它自定义 scheme）。
   只判断 file: 会漏掉安卓的情况，导致给出一个根本点不到的安装指引。 */
function openedFromUrl(){
  try{
    var p = location.protocol;
    return p === 'http:' || p === 'https:';
  }catch(e){ return false; }
}
function isMobileDevice(){ return isAndroidDevice() || isIOSDevice(); }
var INSTALL_OFF_KEY = 'life_records_install_off';

function isStandalone(){
  try{
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: minimal-ui)').matches) return true;
    if(navigator.standalone === true) return true;      /* iOS 的旧写法 */
  }catch(e){}
  return false;
}
function isIOSDevice(){
  try{
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }catch(e){ return false; }
}
function isAndroidDevice(){
  try{ return /Android/i.test(navigator.userAgent); }catch(e){ return false; }
}
function installDismissed(){
  try{ return (Date.now() - (+localStorage.getItem(INSTALL_OFF_KEY) || 0)) < 14*86400000; }
  catch(e){ return false; }
}
function showInstallBar(icon, title, hint, btnText){
  var bar = $('#installBar');
  if(!bar) return;
  $('#installIco').textContent = icon;
  $('#installTitle').textContent = title;
  $('#installHint').textContent = hint;
  var b = $('#installBtn');
  if(btnText){ b.style.display = ''; b.textContent = btnText; }
  else { b.style.display = 'none'; }
  bar.classList.add('show');
}
function hideInstallBar(){
  var bar = $('#installBar');
  if(bar) bar.classList.remove('show');
}
function dismissInstall(){
  try{ localStorage.setItem(INSTALL_OFF_KEY, String(Date.now())); }catch(e){}
  hideInstallBar();
}
function doInstall(){
  if(!PWA.deferred){
    /* 没有安装事件可触发时，给浏览器菜单的操作指引 */
    toast(isIOSDevice() ? '点底部「分享」→「添加到主屏幕」'
                        : '点右上角「⋮」→「安装应用」或「添加到主屏幕」', '');
    return;
  }
  PWA.deferred.prompt();
  PWA.deferred.userChoice.then(function(choice){
    if(choice && choice.outcome === 'accepted'){ toast('正在安装…','ok'); hideInstallBar(); }
    PWA.deferred = null;
  }).catch(function(){});
}

function setupPWA(){
  PWA.standalone = isStandalone();
  PWA.local = !openedFromUrl();

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    PWA.deferred = e;
    if(!PWA.standalone && !installDismissed()){
      showInstallBar('📲','装成 App','装到桌面后就是一个独立图标，全屏打开、没有地址栏，断网也能用。','安装');
    }
  });
  window.addEventListener('appinstalled', function(){
    PWA.deferred = null;
    hideInstallBar();
    toast('已装到桌面，以后点图标就能打开','ok');
  });

  /* 注册 Service Worker：只有 https / localhost 才能用，本地文件打开时自动跳过 */
  if(!PWA.local && 'serviceWorker' in navigator &&
     (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').then(function(reg){
        reg.addEventListener('updatefound', function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener('statechange', function(){
            if(nw.state === 'installed' && navigator.serviceWorker.controller){
              toast('应用已更新，刷新后生效','ok');
            }
          });
        });
      }).catch(function(){ /* 注册失败不影响正常使用，只是没有离线能力 */ });
    });
  }

  /* 延迟弹安装提示，别一进来就糊在脸上；也等新手引导说完 */
  if(!PWA.standalone && !installDismissed()) setTimeout(promptInstall, 2600);
}

/* 什么时候该提示"装成 App"。抽出来是因为引导关闭后要再检查一次。 */
function promptInstall(){

  }else if(isAndroidDevice()){

      '点地址栏右侧的「安装」图标，之后就是一个独立窗口，出现在任务栏和开始菜单里。', null);
  }
}

/* ==========================================================================
   全局搜索
   借鉴自 每日工作台 的 renderGlobalSearch。记录攒到几百条后，找不到就等于废数据。
   ========================================================================== */
function runSearch(qRaw){
  var q = String(qRaw||'').trim().toLowerCase();
  if(!q) return [];
  var out = [];
  function add(kind, icon, title, meta, id, tab, date){
    out.push({ kind:kind, icon:icon, title:String(title||''), meta:meta||'', id:id, tab:tab, date:date||'' });
  }
  Object.keys(DB.daily).forEach(function(d){
    var x = DB.daily[d]; if(!x) return;
    var hay = ((x.line||'')+' '+(x.note||'')+' '+((x.tags||[]).join(' '))).toLowerCase();
    if(hay.indexOf(q) >= 0) add('daily','📅', x.line||'(无描述)', fmtFull(d), d, 'today', d);
  });
  alive(DB.tasks).forEach(function(t){
    var hay = ((t.title||'')+' '+(t.output||'')+' '+(t.blocker||'')+' '+(t.project||'')).toLowerCase();
    if(hay.indexOf(q) >= 0) add('task','✅', t.title, (t.date||'')+' · '+(t.type||'')+' · '+(t.status||''), t.id, 'tasks', t.date);
  });
  alive(DB.notes).forEach(function(n){
    var hay = ((n.content||'')+' '+(n.source||'')).toLowerCase();
    if(hay.indexOf(q) >= 0) add('note','💡', n.content, (n.date||'')+' · '+(n.type||'')+' · '+(n.status||'待整理'), n.id, 'notes', n.date);
  });
  alive(DB.decisions).forEach(function(x){
    var hay = ((x.title||'')+' '+(x.conclusion||'')+' '+(x.basis||'')+' '+(x.options||'')).toLowerCase();
    if(hay.indexOf(q) >= 0) add('decision','🧭', x.title, (x.date||'')+' · '+(x.status||''), x.id, 'decisions', x.date);
  });
  alive(DB.goals).forEach(function(g){
    if(((g.goal||'')+' '+(g.krs||'')).toLowerCase().indexOf(q) >= 0)
      add('goal','🎯', g.goal, (g.period||'')+' · '+(g.status||''), g.id, 'review', '');
  });
  alive(DB.reflects).forEach(function(r){
    var hay = ((r.content||'')+' '+(r.decision||'')).toLowerCase();
    if(hay.indexOf(q) >= 0)
      add('reflect','🪞', r.content, (r.date||'')+(r.decision?' · 关联决策：'+r.decision:''),
          r.id, 'review', r.date);
  });
  alive(DB.projects).forEach(function(p){
    var hay = ((p.name||'')+' '+(p.goal||'')+' '+(p.milestone||'')+' '+(p.risk||'')+' '+(p.note||'')).toLowerCase();
    if(hay.indexOf(q) >= 0)
      add('project','📁', p.name, (p.status||'')+(p.due?' · 截止 '+p.due:''), p.id, 'tasks', p.due||'');
  });
  out.sort(function(a,b){ return (a.date||'') < (b.date||'') ? 1 : ((a.date||'') > (b.date||'') ? -1 : 0); });
  return out.slice(0, 60);
}
function hl(text, q){
  var s = esc(text);
  if(!q) return s;
  try{
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return s.replace(re, '<mark>$1</mark>');
  }catch(e){ return s; }
}
function searchResultsHTML(q){
  if(!String(q||'').trim())
    return '<div class="hint" style="padding:20px 0;text-align:center">输入关键词，搜日记、任务、灵感、决策、目标、反省、项目</div>';
  var hits = runSearch(q);
  if(!hits.length)
    return '<div class="hint" style="padding:20px 0;text-align:center">没找到「'+esc(q)+'」相关的记录</div>';
  var h = '<div class="hint" style="margin-bottom:6px">找到 '+hits.length+' 条</div>';
  hits.forEach(function(x){
    h += '<div class="search-hit" data-act="search-goto" data-tab="'+x.tab+'"'
       + ' data-kind="'+esc(x.kind)+'"'
       + ' data-date="'+esc(x.date||'')+'" data-id="'+esc(x.id||'')+'">'
       + '<span class="sh-i">'+x.icon+'</span>'
       + '<div class="sh-b"><div class="sh-t">'+hl(String(x.title).slice(0,120), q)+'</div>'
       + '<div class="sh-m">'+esc(x.meta)+'</div></div></div>';
  });
  return h;
}

/* ==========================================================================
   AI 助手
   借鉴自 每日工作台：用户自己的 Key，直连官方接口，不经过任何中间服务器。
   默认 DeepSeek —— 它兼容 OpenAI 格式，国内可直连，也可以换成别家。
   ========================================================================== */
var AI_LS = 'life_records_ai_v1';
var AI_DEF_URL = 'https://api.deepseek.com/chat/completions';
var AI_DEF_MODEL = 'deepseek-chat';
var AI = { key:'', url:AI_DEF_URL, model:AI_DEF_MODEL, log:[], busy:false };

/* 对话最多留多少条、单条最多多少字。
   localStorage 是有配额的，而 AI 回复动辄一两千字 ——
   不封顶的话，聊得越久越可能把整个配置（连 Key 一起）写失败。
   40 这个数跟 renderAILog 的显示上限**保持一致**：
   存的比看得见的多，就会出现"我明明聊过、怎么不见了"。 */
var AI_LOG_MAX = 40;
var AI_LOG_CHARS = 4000;

/* 存进来的东西是**不可信的**：可能是旧版本写的、也可能被手改过。
   一律先过一遍形状检查，坏的丢掉而不是让整页崩掉。 */
function aiLogClean(log){
  if(!Array.isArray(log)) return [];
  return log.filter(function(m){
    return m && typeof m === 'object' &&
           (m.role === 'me' || m.role === 'ai' || m.role === 'err') &&
           typeof m.text === 'string';
  }).map(function(m){
    return {
      role: m.role,
      text: m.text.length > AI_LOG_CHARS ? m.text.slice(0, AI_LOG_CHARS) + '…' : m.text
    };
  }).slice(-AI_LOG_MAX);
}

function loadAI(){
  try{
    var raw = localStorage.getItem(AI_LS);
    if(!raw) return;
    var o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      if(o.key) AI.key = o.key;
      if(o.url) AI.url = o.url;
      if(o.model) AI.model = o.model;
      /* ★ 对话记录。以前这里只恢复 key/url/model，
         log 从头到尾既没存过也没读过 —— 聊完一关页面就全没了。 */
      if(o.log) AI.log = aiLogClean(o.log);
    }
  }catch(e){}
}
/* 写失败必须说出来。原来这里是 try{...}catch(e){} 空吞：
   配额满了、或者浏览器禁了存储，用户看到的是一切照常，实际一条都没存下。 */
var aiSaveWarned = false;
function saveAI(){
  try{
    /* 顺手把内存里那份也收到上限 —— 否则聊久了内存有 200 条、
       存储只有 40 条，刷新一次"凭空少了一截"。两处用同一个上限就不会。 */
    AI.log = aiLogClean(AI.log);
    localStorage.setItem(AI_LS, JSON.stringify({
      key:AI.key, url:AI.url, model:AI.model, log:AI.log
    }));
    aiSaveWarned = false;
    return true;
  }catch(e){
    storageOK = false;
    if(!aiSaveWarned){
      aiSaveWarned = true;      /* 只吼一次，不然每问一句弹一次 */
      toast('对话记录存不下了（浏览器存储满或被禁用），这一轮聊完可能会丢','err');
    }
    return false;
  }
}

/* 把最近的数据压成一段上下文。
   不能把整个 DB 丢过去 —— 太大、太贵，而且大部分跟问题无关。 */
function aiContext(){
  var today = todayStr();
  var wk = isoWeek(today);
  var s = weekSummary(wk);
  var lines = [];
  lines.push('【最近 7 天记录】');
  lastNDates(7, today).forEach(function(d){
    var x = dpeek(d);
    if(!x || !hasDaily(d)){ lines.push('  '+fmtShort(d)+' 未记录'); return; }
    var t = [];
    if(num(x.mood)!=null) t.push('心情'+num(x.mood));
    if(num(x.energy)!=null) t.push('能量'+num(x.energy));
    if(num(x.sleep)!=null) t.push('睡眠'+x.sleep+'h');
    if((x.tags||[]).length) t.push(x.tags.join('/'));
    lines.push('  '+fmtShort(d)+' '+t.join(' ')+(x.line?(' — '+x.line):''));
  });
  lines.push('');
  lines.push('【本周统计】记录 '+s.recorded+'/7 天；任务 '+s.taskTotal+' 条（完成 '+s.taskDone+'、阻塞 '+s.taskBlocked
    +'）；救火占比 '+(s.fireRate==null?'—':pct(s.fireRate))+'；总耗时 '+r1(s.minutes/60)+'h');
  var ts = tasksIn(weekDates(wk)).slice(0,15).map(function(t){ return t.title+'('+t.type+'/'+t.status+')'; });
  if(ts.length) lines.push('【本周任务】'+ts.join('；'));
  var ns = alive(DB.notes).slice(0,8).map(function(n){ return String(n.content||'').slice(0,40); });
  if(ns.length) lines.push('【最近灵感】'+ns.join('；'));
  var ds = decisionsAll().slice(0,5).map(function(x){ return x.title+' → '+(x.conclusion||'未定'); });
  if(ds.length) lines.push('【最近决策】'+ds.join('；'));
  var w = DB.weekly[wk];
  if(w && (w.gain||w.problem||w.oneThing)){
    lines.push('【本周复盘】收获：'+(w.gain||'—')+'；问题：'+(w.problem||'—')+'；下周只做一件：'+(w.oneThing||'—'));
  }
  return lines.join('\n');
}
