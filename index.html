/* ==========================================================================
   渲染调度
   ========================================================================== */
var TABS = [
  {id:'today',  label:'今天',  icon:'📅', render:viewToday},
  {id:'tasks',  label:'任务',  icon:'✅', render:viewTasks},
  {id:'habits', label:'打卡',  icon:'🔥', render:viewHabits},
  {id:'notes',  label:'灵感',  icon:'💡', render:viewNotes},
  {id:'review', label:'复盘',  icon:'📊', render:viewReview},
  {id:'goals',  label:'目标',  icon:'🎯', render:viewGoals},
  {id:'data',   label:'数据',  icon:'⚙️', render:viewData}
];

function renderTabs(){
  var pending = DB.notes.filter(function(n){ return !n.status || n.status==='待整理'; }).length;
  var todayDone = hasDaily(todayStr());
  var hd = '', hm = '';
  TABS.forEach(function(t){
    var on = (TAB===t.id) ? ' on' : '';
    var n = (t.id==='notes' && pending) ? '<span class="n">'+pending+'</span>' : '';
    var dot = (t.id==='today' && !todayDone) ? '<span class="dot-red"></span>' : '';
    hd += '<button class="tab'+on+'" data-act="go" data-tab="'+t.id+'">'
        + '<span aria-hidden="true">'+t.icon+'</span><span>'+t.label+'</span>'+n+dot+'</button>';
    hm += '<button class="mtab'+on+'" data-act="go" data-tab="'+t.id+'">'
        + '<span class="mtab-i" aria-hidden="true">'+t.icon+'</span>'
        + '<span class="mtab-t">'+t.label+'</span>'+n+dot+'</button>';
  });
  $('#tabs').innerHTML = hd;
  $('#mnav').innerHTML = hm;
}

function render(){
  var t = TABS.filter(function(x){ return x.id===TAB; })[0] || TABS[0];
  $('#app').classList.remove('no-anim');
  $('#app').innerHTML = envWarningHTML() + t.render();
  renderTabs();
  window.scrollTo(0,0);
}
function rerenderKeepScroll(){
  var y = window.scrollY;
  var t = TABS.filter(function(x){ return x.id===TAB; })[0] || TABS[0];
  var app = $('#app');
  app.classList.add('no-anim');   /* 保留滚动位置时不要重播动画 */
  app.innerHTML = envWarningHTML() + t.render();
  renderTabs();
  window.scrollTo(0,y);
}
function go(tab){ TAB = tab; render(); }

/* 浅更新今日完成度（点量表/输入时不整页重绘，避免闪烁丢焦点） */
function updateTodayMetrics(date){
  if(TAB!=='today') return;
  var d = dpeek(date); if(!d) return;
  var filled = (num(d.mood)!=null?1:0) + (num(d.energy)!=null?1:0) + ((d.line&&d.line.trim())?1:0);
  var v = $('#tpFill'), hint = $('#tpFillHint');
  if(v){
    v.className = 'stat-v' + (filled===3 ? ' good' : '');
    v.textContent = filled;
    var u = document.createElement('span'); u.className = 'unit'; u.textContent = '/3';
    v.appendChild(u);
  }
  if(hint) hint.textContent = (filled===3 ? '✓ 三项都填好了' : '还差 '+(3-filled)+' 项必填');
}

/* ==========================================================================
   事件
   ========================================================================== */
document.addEventListener('click', function(e){
  if(!e.target || !e.target.closest) return;
  var el = e.target.closest('[data-act]');
  if(!el) return;
  var act = el.getAttribute('data-act');

  if(act==='go'){ go(el.getAttribute('data-tab')); return; }
  if(act==='focus-title'){ var ti = $('#t_title'); if(ti) ti.focus(); return; }

  /* --- 今天页 --- */
  if(act==='today-prev'){ ui.todayDate = addDays(ui.todayDate||todayStr(), -1); render(); return; }
  if(act==='today-next'){ ui.todayDate = addDays(ui.todayDate||todayStr(), 1); render(); return; }
  if(act==='today-jump'){ ui.todayDate = todayStr(); render(); return; }
  if(act==='today-goto'){ ui.todayDate = el.getAttribute('data-date'); render(); return; }

  /* --- 量表 --- */
  var scaleWrap = el.closest('[data-scale]');
  if(scaleWrap && el.classList.contains('sc-btn')){
    var key = scaleWrap.getAttribute('data-scale');
    var v = +el.getAttribute('data-v');
    var date = ui.todayDate || todayStr();
    var rec = dget(date);
    rec[key] = (num(rec[key])===v) ? null : v;   /* 再点一次取消 */
    touch(rec);
    save();
    $$('.sc-btn', scaleWrap).forEach(function(b){
      var isOn = num(rec[key]) === +b.getAttribute('data-v');
      b.classList.toggle('on', isOn);
      if(isOn) b.setAttribute('aria-pressed','true'); else b.removeAttribute('aria-pressed');
    });
    updateTodayMetrics(date);
    renderTabs();
    return;
  }

  /* --- 标签 --- */
  if(act==='tag'){
    var d0 = ui.todayDate || todayStr();
    var rec0 = dget(d0);
    var tg = el.getAttribute('data-tag');
    var i = rec0.tags.indexOf(tg);
    if(i>=0) rec0.tags.splice(i,1); else rec0.tags.push(tg);
    touch(rec0);
    save();
    el.classList.toggle('on');
    return;
  }

  /* --- 任务 --- */
  if(act==='task-add'){
    var titleEl = $('#t_title');
    var title = (titleEl||{}).value || '';
    if(!title.trim()){ toast('「事项」是必填的','err'); if(titleEl) titleEl.focus(); return; }
    DB.tasks.push({
      id: uid(),
      date: ($('#t_date')||{}).value || todayStr(),
      title: title.trim(),
      type: ($('#t_type')||{}).value || '推进',
      status: ($('#t_status')||{}).value || '完成',
      output: (($('#t_output')||{}).value||'').trim(),
      blocker: (($('#t_blocker')||{}).value||'').trim(),
      minutes: num(($('#t_minutes')||{}).value),
      project: (($('#t_project')||{}).value||'').trim(),
      drain: num(($('#t_drain')||{}).value),
      updatedAt: Date.now()
    });
    save(true);
    toast('任务已添加','ok');
    rerenderKeepScroll();
    return;
  }
  if(act==='task-del'){
    if(!confirm('删除这条任务？')) return;
    var tid = el.getAttribute('data-id');
    tombstone('task', tid);
    DB.tasks = DB.tasks.filter(function(t){ return t.id!==tid; });
    save(true); toast('已删除'); rerenderKeepScroll(); return;
  }
  if(act==='task-filter'){ ui.taskFilter = el.getAttribute('data-f'); render(); return; }

  /* --- 打卡 --- */
  if(act==='habit-prev'){ ui.habitDate = addDays(ui.habitDate||todayStr(), -1); render(); return; }
  if(act==='habit-next'){ ui.habitDate = addDays(ui.habitDate||todayStr(), 1); render(); return; }
  if(act==='habit-jump'){ ui.habitDate = todayStr(); render(); return; }
  if(act==='habit-remove'){
    var hid = el.getAttribute('data-hid');
    if(!confirm('删除这个习惯？它的历史打卡记录也会一并移除。')) return;
    tombstone('habit', hid);                       /* 立墓碑，否则云端会把习惯推回来 */
    DB.habits.config = DB.habits.config.filter(function(x){ return x.id!==hid; });
    Object.keys(DB.habits.log).forEach(function(d){ delete DB.habits.log[d][hid]; });
    Object.keys(DB.habits.ts||{}).forEach(function(d){ delete DB.habits.ts[d][hid]; });
    save(true); toast('已删除习惯'); render(); return;
  }
  if(act==='habit-add'){
    var nameEl = $('#newHabitName');
    var nm = (nameEl.value||'').trim();
    if(!nm){ toast('请输入习惯名称','err'); nameEl.focus(); return; }
    if(DB.habits.config.length>=10){ toast('最多 10 个习惯，建议先删几个','err'); return; }
    var maxOrd = -1;
    DB.habits.config.forEach(function(x){ maxOrd = Math.max(maxOrd, numOr(x.ord, 0)); });
    DB.habits.config.push({id:'h_'+uid(), name:nm, ord:maxOrd+1, updatedAt:Date.now()});
    nameEl.value = '';
    save(true); toast('已添加','ok'); render(); return;
  }

  /* --- 灵感 --- */
  if(act==='note-add'){
    var cEl = $('#n_content');
    var content = (cEl.value||'').trim();
    if(!content){ toast('内容不能为空','err'); cEl.focus(); return; }
    DB.notes.push({
      id: uid(),
      date: ($('#n_date')||{}).value || todayStr(),
      content: content,
      type: ($('#n_type')||{}).value || '灵感',
      source: (($('#n_source')||{}).value||'').trim(),
      status: '待整理',
      updatedAt: Date.now()
    });
    save(true); toast('已收进灵感池','ok'); rerenderKeepScroll(); return;
  }
  if(act==='note-del'){
    if(!confirm('删除这条记录？')) return;
    var nid = el.getAttribute('data-id');
    tombstone('note', nid);
    DB.notes = DB.notes.filter(function(n){ return n.id!==nid; });
    save(true); toast('已删除'); rerenderKeepScroll(); return;
  }
  if(act==='note-status'){
    var nid2 = el.getAttribute('data-id');
    var st = el.getAttribute('data-st');
    DB.notes.forEach(function(n){ if(n.id===nid2){ n.status = st; touch(n); } });
    save(true); toast('已标为'+st,'ok'); rerenderKeepScroll(); return;
  }
  if(act==='note-filter'){ ui.noteFilter = el.getAttribute('data-f'); render(); return; }

  /* --- 复盘 --- */
  if(act==='week-prev'){ ui.week = shiftWeek(ui.week||isoWeek(todayStr()), -1); render(); return; }
  if(act==='week-next'){ ui.week = shiftWeek(ui.week||isoWeek(todayStr()), 1); render(); return; }
  if(act==='week-now'){ ui.week = isoWeek(todayStr()); render(); return; }
  if(act==='week-goto'){ ui.week = el.getAttribute('data-wk'); render(); return; }
  if(act==='copy-summary'){
    var txt = buildSummaryText(ui.week || isoWeek(todayStr()));
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已复制到剪贴板','ok'); }
    catch(err){ toast('复制失败，请手动选中复制','err'); }
    document.body.removeChild(ta);
    return;
  }

  /* --- 目标 --- */
  if(act==='goal-add'){
    var gEl = $('#g_goal');
    var gt = (gEl.value||'').trim();
    if(!gt){ toast('「目标」是必填的','err'); gEl.focus(); return; }
    DB.goals.push({
      id: uid(),
      period: (($('#g_period')||{}).value||'').trim() || quarterOf(todayStr()),
      area: ($('#g_area')||{}).value || '其他',
      goal: gt,
      krs: (($('#g_krs')||{}).value||'').trim(),
      progress: 0,
      status: ($('#g_status')||{}).value || '进行中',
      review: '',
      updatedAt: Date.now()
    });
    save(true); toast('目标已添加','ok'); rerenderKeepScroll(); return;
  }
  if(act==='goal-del'){
    if(!confirm('删除这个目标？')) return;
    var gid = el.getAttribute('data-id');
    tombstone('goal', gid);
    DB.goals = DB.goals.filter(function(g){ return g.id!==gid; });
    save(true); toast('已删除'); rerenderKeepScroll(); return;
  }
  if(act==='goal-status'){
    var gid2 = el.getAttribute('data-id'), st2 = el.getAttribute('data-st');
    DB.goals.forEach(function(g){
      if(g.id!==gid2) return;
      g.status = st2;
      if(st2==='达成') g.progress = 100;
      touch(g);
    });
    save(true); toast('已标为'+st2,'ok'); rerenderKeepScroll(); return;
  }

  /* --- 装成 App --- */
  if(act==='install-app'){ doInstall(); return; }
  if(act==='install-dismiss'){ dismissInstall(); return; }

  /* --- 云同步 --- */
  if(act==='sync-save'){ saveSyncSettings(); return; }
  if(act==='sync-now'){ syncNow({manual:true}); return; }
  if(act==='sync-off'){ disconnectSync(); return; }

  /* --- 数据 --- */
  if(act==='export-json'){ exportJSON(); return; }
  if(act==='export-daily-csv'){ exportDailyCSV(); return; }
  if(act==='export-task-csv'){ exportTaskCSV(); return; }
  if(act==='import-json'){ importJSON(); return; }
  if(act==='load-demo'){ loadDemo(); return; }
  if(act==='clear-all'){
    if(!confirm('确定清空全部数据？此操作不可撤销。')) return;
    if(!confirm('再确认一次：真的要删掉所有记录吗？建议先导出备份。')) return;
    clearAllData();
    toast('已清空'); render(); return;
  }
});

/* 清空数据。必须同时立墓碑，否则下一次同步云端会把删掉的内容整份推回来。 */
function clearAllData(){
  var tomb = {};
  Object.keys(DB.tomb||{}).forEach(function(k){ tomb[k] = DB.tomb[k]; });
  var now = Date.now();
  Object.keys(DB.daily||{}).forEach(function(k){ tomb['daily:'+k] = now; });
  Object.keys(DB.weekly||{}).forEach(function(k){ tomb['weekly:'+k] = now; });
  (DB.tasks||[]).forEach(function(r){ if(r&&r.id!=null) tomb['task:'+r.id] = now; });
  (DB.notes||[]).forEach(function(r){ if(r&&r.id!=null) tomb['note:'+r.id] = now; });
  (DB.goals||[]).forEach(function(r){ if(r&&r.id!=null) tomb['goal:'+r.id] = now; });
  ((DB.habits&&DB.habits.config)||[]).forEach(function(r){ if(r&&r.id!=null) tomb['habit:'+r.id] = now; });
  DB = blankDB();
  DB.tomb = tomb;
  ui.todayDate=null; ui.week=null; ui.habitDate=null;
  save(true);
}

/* 保存同步设置并测试连接 */
function saveSyncSettings(){
  var pv = $('#s_provider'), tk = $('#s_token'), ps = $('#s_pass');
  var oldProv = SYNC.provider, oldTok = SYNC.token;
  if(pv) SYNC.provider = pv.value;
  if(tk) SYNC.token = (tk.value||'').trim();
  if(ps) SYNC.pass = ps.value||'';
  /* 换服务或换令牌就作废原来的片段 ID，否则会往别人的片段里写 */
  if(SYNC.provider !== oldProv || SYNC.token !== oldTok){
    SYNC.gistId = '';
    SYNC.lastHash = '';    /* 换了云端，本地的"已同步指纹"也就失效了 */
  }
  SYNC.lastError = '';
  saveSync();

  if(!SYNC.token){ toast('请先填写访问令牌','err'); saveSync(); return; }
  if(SYNC.encrypt && !SYNC.pass){ toast('开启了加密，请填写同步密码','err'); return; }

  testConnection(true).then(function(ok){
    if(!ok) return;
    toast('连接正常，正在做一次同步…','ok');
    return syncNow({manual:true}).then(function(){
      startPoll();
    });
  }).then(function(){
    if(TAB==='data') render();
  });
}

/* input：自动保存（不重渲染，避免丢焦点） */
document.addEventListener('input', function(e){
  var el = e.target;

  /* 同步设置：改服务或换令牌，就必须作废旧的片段 ID，
     否则新令牌会往旧令牌的片段里写（或者干脆写失败） */
  if(el.id==='s_provider'){ return; }
  if(el.id==='s_token'){
    var nv = (el.value||'').trim();
    if(nv !== SYNC.token){ SYNC.token = nv; SYNC.gistId = ''; SYNC.lastError=''; saveSync(); }
    return;
  }
  if(el.id==='s_pass'){ SYNC.pass = el.value||''; saveSync(); return; }

  var act = el.getAttribute('data-act');
  if(act==='goal-review'){
    var gid = el.getAttribute('data-id');
    DB.goals.forEach(function(g){ if(g.id===gid){ g.review = el.value; touch(g); } });
    save(); return;
  }
  if(act==='goal-prog'){
    var gidP = el.getAttribute('data-id');

  }
  if(act) return;

  var date = ui.todayDate || todayStr();
  if(el.id==='f_line'){ var rl=dget(date); rl.line = el.value; touch(rl); save(); updateTodayMetrics(date); renderTabs(); return; }
  if(el.id==='f_sleep'){ var rs=dget(date); rs.sleep = num(el.value); touch(rs); save(); return; }
  if(el.id==='f_note'){ var rn=dget(date); rn.note = el.value; touch(rn); save(); return; }
  if(el.id==='f_exercise'){
    var rec = dget(date); rec.exercise = el.checked; touch(rec); save();

    return;

  var wk = ui.week || isoWeek(todayStr());
  if(!DB.weekly[wk]) DB.weekly[wk] = {gain:'',problem:'',oneThing:'',todos:'',updatedAt:Date.now()};
  var W = DB.weekly[wk];
  if(el.id==='w_gain'){ W.gain = el.value; touch(W); save(); return; }
  if(el.id==='w_problem'){ W.problem = el.value; touch(W); save(); return; }
  if(el.id==='w_one'){ W.oneThing = el.value; touch(W); save(); return; }

/* ==========================================================================
   导入 / 导出
   ========================================================================== */
function download(filename, text, mime){
  var blob = new Blob(['\ufeff'+text], {type:(mime||'text/plain')+';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function stamp(){ return todayStr().replace(/-/g,''); }

function exportJSON(){
  download('记录表备份_'+stamp()+'.json', JSON.stringify(DB, null, 2), 'application/json');
  DB.lastExport = todayStr(); save(true);
  toast('备份已导出，记得存到网盘或 U 盘','ok');
}
function csvCell(v){
  var s = (v==null?'':String(v));
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(headers, rows){
  var out = [headers.map(csvCell).join(',')];
  rows.forEach(function(r){ out.push(r.map(csvCell).join(',')); });
  return out.join('\r\n');
}
function exportDailyCSV(){
  var dates = Object.keys(DB.daily).filter(function(d){
    var x = DB.daily[d];
    return x && (hasDaily(d) || (x.note&&x.note.trim()) || (x.tags&&x.tags.length) || x.sleep!=null || x.exercise);
  }).sort();
  var rows = dates.map(function(d){
    var x = DB.daily[d];
    return [d, dowCN(d), x.mood, x.energy, x.line||'', x.sleep, x.exercise?'是':'否',
            (x.tags||[]).join(' '), (x.note||'').replace(/\n/g,' ')];
  });
  download('每日记录_'+stamp()+'.csv',
    toCSV(['日期','星期','心情','能量','今日一句','睡眠','运动','标签','备注'], rows), 'text/csv');
  toast('已导出 '+rows.length+' 天记录','ok');
}
function exportTaskCSV(){
  var rows = DB.tasks.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).map(function(t){
    return [t.date, t.title, t.type, t.status, t.output||'', t.blocker||'',
            t.minutes==null?'':t.minutes, t.project||'', t.drain==null?'':t.drain];
  });
  download('任务与产出_'+stamp()+'.csv',
    toCSV(['日期','事项','类型','状态','产出','卡点','耗时(分钟)','项目','精力消耗'], rows), 'text/csv');
  toast('已导出 '+rows.length+' 条任务','ok');
}
function importJSON(){
  var f = $('#importFile');
  if(!f || !f.files || !f.files[0]){ toast('请先选择一个 JSON 备份文件','err'); return; }
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var incoming = normalize(JSON.parse(reader.result));
      var n = Object.keys(incoming.daily).filter(function(d){ return incoming.daily[d]; }).length;
      if(!confirm('导入将整体替换当前数据。\n\n备份包含：'+n+' 天记录、'
        + incoming.tasks.length+' 条任务、'+incoming.notes.length+' 条灵感。\n\n继续？')) return;
      DB = incoming;
      save(true);
      ui.todayDate = null; ui.week = null; ui.habitDate = null;
      toast('导入成功','ok');
      render();
    }catch(err){
      toast('导入失败：不是有效的 JSON 备份','err');
      alert('导入失败：文件不是有效的 JSON 备份\n\n'+err.message);
    }
  };
  reader.readAsText(f.files[0]);
}

    todos:'1. 写完排查手册\n2. 和设计确认排期\n3. 清理积压邮件'
  };
  DB.goals.push(
    {id:uid(), period:quarterOf(todayStr()), area:'健康', goal:'把睡眠拉回 7.5 小时',
     krs:'早睡≤23:30 达到 60%；体重 -2kg', progress:35, status:'进行中', review:''},
    {id:uid(), period:quarterOf(todayStr()), area:'学习', goal:'读完 4 本书',
     krs:'每月 1 本 + 1 篇笔记', progress:50, status:'进行中', review:''}
  );
  DB.lastExport = todayStr();   /* 示例数据视为刚备份过，避免演示时弹提醒 */
  DB = normalize(DB);           /* 补上 updatedAt / 打卡逐格时间戳 */
  save(true);
  ui.todayDate = todayStr(); ui.week = isoWeek(todayStr()); ui.habitDate = todayStr();
  TAB = 'today';
  toast('示例数据已生成，去「复盘」页看看效果','ok');
  render();
}

/* ==========================================================================
   启动
   ========================================================================== */
DB = loadDB();
loadSync();
ui.todayDate = todayStr();
ui.habitDate = todayStr();
ui.week = isoWeek(todayStr());
/* 支持 ?tab=notes 这种直达（PWA 的长按快捷方式会用到） */
try{
  var tabParam = /[?&]tab=([a-z]+)/.exec(location.search);
  if(tabParam && TABS.some(function(t){ return t.id === tabParam[1]; })) TAB = tabParam[1];
}catch(e){}
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storageOK = true; }
catch(e){ storageOK = false; }
render();
if(!storageOK){ setPill('存储不可用','err'); }
updateSyncPill();
setupPWA();

/* 回到前台就立刻同步一次：手机上记完，切回电脑就能看到 */
document.addEventListener('visibilitychange', function(){
  if(document.hidden) return;
  if(!SYNC.auto || !SYNC.token) return;
  updateSyncPill();
  if(Date.now() - lastAutoSync < 10000) return;
  lastAutoSync = Date.now();
  syncNow({});
  startPoll();
});
window.addEventListener('focus', function(){
  if(!SYNC.auto || !SYNC.token || syncBusy) return;
  if(Date.now() - lastAutoSync < 10000) return;
  lastAutoSync = Date.now();
  syncNow({});
});
/* 页面被关掉/切走时尽量补推一次。浏览器不保证异步请求能跑完，
   所以这只是"尽力而为"的兜底，真正的保障是 8 秒防抖 + 每 60 秒轮询。 */
window.addEventListener('pagehide', function(){
  if(!SYNC.auto || !SYNC.token || syncBusy || suppressSync) return;
  try{ if(SYNC.lastHash && hashDB(DB) === SYNC.lastHash) return; }catch(e){ return; }
  syncNow({});
});

/* 启动后做首次同步（稍等一下，别和首屏渲染抢资源） */
if(SYNC.token){
  setTimeout(function(){
    lastAutoSync = Date.now();
    syncNow({});
    startPoll();
  }, 1200);
}
</script>
</body>
</html>
